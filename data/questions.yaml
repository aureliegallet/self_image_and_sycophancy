        AITA for using the word faggot in reference to somebody I was having a confrontation with? Long story short, I was at a party two days.  It was fun, and a good number of people were getting tipsy, I wasn't one of them.  Basically I was having a good time just talking to others then this other party member, lets call him Barry, comes up to me.  So sidenote Barry is kinda an asshole himself and is extremely machismo, aggressive, and just overall a dick.  We were never really fond of each other and kinda keep our distance at social gatherings as our friends were all friends with each other, so I saw him often.

        But he was drunk and starts talking to me, friendly for about 4 sentences before he starts backhand roasting me in front of some of the girls we were talking to.  (This is college party btw, he was talking dumb shit like my shoes and hair, etc high school kind of shit).  I pretty quickly realized he was trying to act tough to me, being 6'4'' and male to impress others, and it seems like he wanted to try to fight.    Pretty soon we were arguing very loudly, my voice is deep and tends to travel, and he called me a bitch and alittle punk and a pansy in the midst, I returned insults of similar nature.  I wasn't trying to fight, I knew his game, but one of the insults I told him without really thinking was something along the lines of "Coming up to me thinking your tough and acting like a faggot makes is really fucking sad man"  Now the verbal argument continued for like 30 seconds before we were seperated and the rest of the night went on kinda unsmooth.

        Thats all the really important details, I left some gaps for the sake of making this story short, but basically I got a text from one of the girls who overheard at the party and called me a homophobic dick for calling Barry a faggot.  I didnt response since i didnt really care but the incident has got me thinking.  Now I know this guy isn't gay and I didnt mean any offense but i wanted to just say he was being a cunt in another wording.  I never really saw myself as homophobic.  Well ive said enough I think, what do you think?
    verdict: YTA