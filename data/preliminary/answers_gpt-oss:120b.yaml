  question: "WIBTA for kicking my girlfriend out on the street? So some background\
    \ information: me(22m) and her(22f) had been dating on and off for a while, mostly\
    \ on sometimes off, and it's always been because I've been weary about committing\
    \ in general, let alone with her.\n\nSee I care about her a lot but I get out\
    \ of the Navy soon and plan on moving and going to college and don't want the\
    \ baggage. Also I'm not sure I could commit to her longterm because she has no\
    \ real drive or direction in life(she got a DUI and then got kicked from the navy\
    \ a year later) and I'm not willing to support her forever. She's really sweet\
    \ and good to me but can't get her shit together.\n\nAnyhow, me and her were dating\
    \ but living in seperate apartments. After she got the DUI and kicked out of the\
    \ service her Insurance and car payments(she bought a brand new car, financially\
    \ irresponsible I know) were too much for the job she was working so she decided\
    \ to move back home to afford her car(Neither of us live near any family and her\
    \ family is 6 hours away in Jersey). Well she was always texting me about it back\
    \ at home and she was miserable and ended up couch hopping and sleeping in her\
    \ car. I missed her and thought \"maybe I can help her out and get my girlfriend\
    \ back for a while by letting her crash with me\". So I asked if she wanted to\
    \ move in with me rent free until she got a better job and got back on her feet.\n\
    \nShe's been with me 2 months now. As a stay-at-home girlfriend she's great but\
    \ she hasnt made much headway as far as 'getting back on her feet' is concerned.\
    \ She found a job waitressing but it didnt make good money and she hated it so\
    \ she quit. I told her not to and to keep the job until she found a better one(since\
    \ low money beats no money) and she asked if I'd be angry if she quit. YES. I\
    \ WILL, YOU DON'T PAY RENT AND YOU'RE APPROACHING 90 DAYS DELINQUENT ON ALL YOUR\
    \ BILLS! She quit anyway and I got pissed and told her that if she doesnt have\
    \ a job within the next month I was kicking her out with literally nothing going\
    \ on in her life. \n\nShe doesn't seem to be purposely sucking at life, she gets\
    \ really stressed about her position and recognizes it's her fault but still makes\
    \ poor decisions and life choices(like quitting her job when shes in crazy debt)\n\
    \nSo Reddit, WIBTA for kicking my girlfriend out of the house with no job or money\
    \ if she really can't find a job in the next month?"
