    \ because she looks nothing like him\u201D) is a *double\u2011down* on the very\
    \ prejudice you were initially offended by. You perpetuated the same type of bigotry\
    \ you were upset about.\n\n3. **You ignored a chance to de\u2011escalate.**  \n\
    \   - You could have said something like, \u201CThat joke was offensive and hurtful;\
