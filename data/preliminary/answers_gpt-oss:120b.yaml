    t obligate him to let you remain indefinitely without contributing or showing\
    \ progress.  \n\n### Why you\u2019re not the asshole  \n\n1. **You\u2019ve had\
    \ a rough year** \u2013 a DUI, being discharged from the Navy, and the sudden\
