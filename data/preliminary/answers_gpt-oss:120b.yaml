    \ drivers seat to which I made it my duty to prevent that just in case she decides\
    \ to drive off in that state.\n\nAfter some arguing and she really went off on\
    \ me to leave her the f*** alone and I'm not the boss of her etc. I suggested\
    \ to her that I drive her home with her car and then take an uber back to the\
    \ party but she said no. I told her she can sit in the passenger seat and to contact\
    \ someone to fetch her then she said no her brother is on his way, a struggle\
    \ ensued and I manage to get her car keys out of her hands as she was in no condition\
    \ to drive.\n\nEventually she sits in the car while I have her car keys after\
    \ she threatened to call the police \n\nAfter maybe 20-30mins the police arrives\
    \ and we are in shock. We speak to the police and we let her talk first, (to my\
    \ shock) she tells the police that I'm trying to sleep with her and that we drugged\
    \ her (remember this friend and I know each other for 8 years by now). So I was\
    \ shocked and we all denied her allegations. The police asked for the car keys\
    \ and we gave it them, then we all just told her she must f*** off.\n\nWhen I\
    \ got home, I just sent her a text to tell her I've never been so humiliated in\
