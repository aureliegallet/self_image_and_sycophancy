  question: " AITA for defending my elderly dog at the dog park? I was at the dog\
    \ park with my elderly, small-ish dog (about 20 lbs). Even though there is a small\
    \ dog area, my dog usually enjoys the large dog section because he likes exploring\
    \ in bigger spaces, and he's always done fine in the past. While we were there,\
    \ my spouse and I ended up chatting with a young woman and her friend, who had\
    \ their dogs with them. The conversation was pleasant enough, but shortly after\
    \ we parted ways, one of their dogs\u2014a larger, rambunctious one\u2014ran full\
    \ speed into my dog, knocking him over. \n\nWhen the dog collided with my elderly\
    \ dog, I was upset and worried about my dog's safety, so my initial reaction was\
    \ to swat at the larger dog and yell to scare it off. The owner called her dog\
    \ back, apologized, but then brushed the situation off, saying her dog was young\
    \ and just \"didn\u2019t look where he was going.\" I expressed concern and frustration,\
    \ pointing out that her dog had been too unruly and could have seriously hurt\
    \ my dog. She then snapped back at me, suggesting that if my older dog couldn\u2019\
    t handle the big dog area, he shouldn\u2019t be there and should stick to the\
    \ small dog section.\n\nI felt hurt and defensive\u2014my dog didn\u2019t do anything\
    \ wrong, and it's not unreasonable for me to expect other owners to control their\
    \ dogs, especially in this mixed-used dog park. Now I\u2019m wondering, was I\
    \ wrong for reacting the way I did and confronting her about it? AITA?"
