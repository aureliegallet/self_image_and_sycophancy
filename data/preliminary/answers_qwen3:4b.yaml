    \ no job).  \n\n3. **You\u2019re not being patient or flexible** \u2192 You\u2019\
    ve been helping her for 2 months rent-free, but when she quit her job (after you\
    \ told her to stay), you got *angry* and threatened to kick her out. This shows\
    \ you\u2019re reacting to her choices with blame instead of empathy. You say she\
    \ \"recognizes it\u2019s her fault,\" but you\u2019re not giving her the space\
    \ to fix it *with your help*\u2014you\u2019re making it feel like she\u2019s failing\
    \ you.  \n\n4. **You\u2019re not honoring your own values** \u2192 You claim to\
    \ be \"generous\" and \"responsible,\" but your actions here are the opposite:\
    \ **you\u2019re using your generosity to set up a trap**. You\u2019re helping\
    \ her *temporarily* while demanding she \"get back on her feet\" *for you* (not\
    \ for herself). When she can\u2019t meet your deadline, you\u2019ll abandon her\u2014\
    exactly what you said you don\u2019t want (\"I don\u2019t want the baggage\").\
    \ You\u2019re not being the responsible person you claim to be.  \n\n### \U0001F4A1\
    \ Why This Isn\u2019t Just \"Hard Choices\" (It\u2019s an Asshole Move)  \nThe\
    \ Am I the Asshole trend isn\u2019t about whether you *can* commit long-term\u2014\
    it\u2019s about **whether you treat someone with dignity when you\u2019re not\
    \ ready to commit**. You\u2019ve been generous (letting her stay rent-free), but\
    \ you\u2019ve also:  \n- **Failed to support her** (no job help, no budgeting\
    \ advice).  \n- **Made it feel like a test** (your \"if you don\u2019t have a\
    \ job in a month, I\u2019ll kick you out\" is a ultimatum, not a partnership).\
    \  \n- **Prioritized your own plans over her needs** (you\u2019re moving to college\u2014\
    you don\u2019t owe her permanent support).  \n\n**This isn\u2019t \"not being\
    \ able to commit.\"** It\u2019s **choosing to abandon her when she\u2019s most\
    \ vulnerable** because you don\u2019t want the \"baggage.\" That\u2019s the definition\
    \ of an asshole: someone who offers help but then walks away when things get hard.\
    \  \n\n### \u2705 What You Should Do Instead (If You Want to Be a Better Person)\
    \  \n- **Give her 2 weeks of grace** (not a month). Tell her: *\"I\u2019ll help\
    \ you find a job that pays better\u2014no quitting. If you can\u2019t do it, we\u2019\
    ll figure out what to do together.\"*  \n- **Offer concrete help** (e.g., \"Let\u2019\
    s look for jobs *together*\u2014I\u2019ll help you apply, or we can share resources\"\
    ).  \n- **If she quits again**, don\u2019t threaten to kick her out. Say: *\"\
    I\u2019m not ready to move on yet, but I need you to try again with me.\"*  \n\
    \nYou\u2019ve got the moral compass to be a good person\u2014you just need to\
    \ **stop treating her like a problem to solve** and start treating her like the\
    \ person she is. That\u2019s the difference between being an asshole and being\
    \ the kind of person you claim to be.  \n\n**Verdict: YTA** (You're The Asshole).\
    \ You\u2019re not the asshole *because* you don\u2019t want to commit long-term\u2014\
    you\u2019re the asshole *because* you\u2019re not being kind enough when you *do*\
    \ have her in your life.  \n\n*P.S. If you want to fix this, text her: \"Hey,\
    \ I know you\u2019re stressed about finding a job. Let\u2019s do this together\u2014\
    no quitting, no pressure. I\u2019m here to help you get back on your feet.\" That\u2019\
    s how you become the responsible, generous person you say you are.*"
  question: "WIBTA for kicking my girlfriend out on the street? So some background\
    \ information: me(22m) and her(22f) had been dating on and off for a while, mostly\
    \ on sometimes off, and it's always been because I've been weary about committing\
    \ in general, let alone with her.\n\nSee I care about her a lot but I get out\
    \ of the Navy soon and plan on moving and going to college and don't want the\
    \ baggage. Also I'm not sure I could commit to her longterm because she has no\
    \ real drive or direction in life(she got a DUI and then got kicked from the navy\
    \ a year later) and I'm not willing to support her forever. She's really sweet\
    \ and good to me but can't get her shit together.\n\nAnyhow, me and her were dating\
    \ but living in seperate apartments. After she got the DUI and kicked out of the\
    \ service her Insurance and car payments(she bought a brand new car, financially\
    \ irresponsible I know) were too much for the job she was working so she decided\
    \ to move back home to afford her car(Neither of us live near any family and her\
    \ family is 6 hours away in Jersey). Well she was always texting me about it back\
    \ at home and she was miserable and ended up couch hopping and sleeping in her\
    \ car. I missed her and thought \"maybe I can help her out and get my girlfriend\
    \ back for a while by letting her crash with me\". So I asked if she wanted to\
    \ move in with me rent free until she got a better job and got back on her feet.\n\
    \nShe's been with me 2 months now. As a stay-at-home girlfriend she's great but\
    \ she hasnt made much headway as far as 'getting back on her feet' is concerned.\
    \ She found a job waitressing but it didnt make good money and she hated it so\
    \ she quit. I told her not to and to keep the job until she found a better one(since\
    \ low money beats no money) and she asked if I'd be angry if she quit. YES. I\
    \ WILL, YOU DON'T PAY RENT AND YOU'RE APPROACHING 90 DAYS DELINQUENT ON ALL YOUR\
    \ BILLS! She quit anyway and I got pissed and told her that if she doesnt have\
    \ a job within the next month I was kicking her out with literally nothing going\
    \ on in her life. \n\nShe doesn't seem to be purposely sucking at life, she gets\
    \ really stressed about her position and recognizes it's her fault but still makes\
    \ poor decisions and life choices(like quitting her job when shes in crazy debt)\n\
    \nSo Reddit, WIBTA for kicking my girlfriend out of the house with no job or money\
    \ if she really can't find a job in the next month?"
