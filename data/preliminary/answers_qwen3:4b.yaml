  question: "AITA for exploding on my father's wife Throwaway  \n\nHear me out on\
    \ this one.\n\nIn regards to ages, I\u2019m 17, Dad is 43, and father\u2019s wife\
    \ 27 or 28.\n\nSix years ago, it came out during couple\u2019s therapy that my\
    \ father was cheating on my mom and that his mistress was pregnant. My mom initiated\
    \ divorce. Six months after the divorce was finalized, my father married his now\
    \ wife and they had three kids. My dad has apologized for his actions and we are\
    \ still doing therapy, so one day I can truly forgive him.\n\nI do not like my\
    \ so-called stepmom, but in regards that she is father\u2019s wife, I begrudgingly\
    \ show respect. I have never called her out of her name until later in this story.\
    \ If she speaks to me, I will say something back. If I am in her home, I will\
    \ clean up after myself. However, I will always refer to her as my father\u2019\
    s wife and she will never be a prominent figure in my life. This is something\
    \ she cannot accept.\n\nI have never let my true feelings about her be known,\
    \ until the other day. While at my father\u2019 house, she attempted to make a\
    \ cringe-worthy joke about my girlfriend with the saying \u201CThe blacker the\
    \ berry the sweeter the juice,\u201D and said that I was good enough looking boy\
    \ and she was confused about why I would go out with a dark-skinned black girl\
    \ and not someone white like myself. I guess the look on my face told her to shut\
    \ up, so she changed the subject.\n\nShe then revealed that when my dad gets back\
    \ from his TDY (Temporary Duty Assignment); she had booked a photoshoot for family\
    \ portraits of us and she wanted to do a special photo of me and her two sons\
    \ holding signs that say \u201CDon\u2019t mess with her,\u201D with her 2-month-old\
    \ daughter. I have never been in any of the previous family portraits because\
    \ I refused to and my Dad said I didn\u2019t have to.\n\nI told her I was not\
    \ going to participate\n\nShe asked why I was being difficult and that just she\
    \ wanted family pictures with all of her children.\n\nSix years\u2019 worth of\
    \ hurt came out. I told her she was a fool to ever think I was her child or that\
    \ I considered her family. From my perspective, she was nothing, but my father\u2019\
    s racist side chick, who had nothing better to do, but chase after a married man\
    \ and sit on her ass all day. I took it a step further and fully implied that\
    \ her daughter wasn\u2019t my father\u2019s child because she looks nothing like\
    \ him.\n\nShe turned red and started crying, saying how disrespectful I was and\
    \ I had no right to talk to her in such a manner. I fully admit I called her a\
    \ Bitch and stated she didn\u2019t even deserve any respect from me because she\
    \ didn\u2019t respect my mother\u2019s marriage and if she ever disrespected my\
    \ girlfriend again, she would live to regret it. After realizing what I had said,\
    \ I left and haven\u2019t talked to her since.\n\nEveryone that I have talked\
    \ to say I should at least apologize for calling her a bitch and I don\u2019t\
    \ mind doing that.  However, certain people say I shouldn\u2019t have gone off\
    \ on her, because my dad was gone and she just had a baby, etc.\n\nSo who is the\
    \ asshole?"
