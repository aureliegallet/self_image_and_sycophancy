  question: "AITA For cutting off friendship after 1 drunk night ? This happened a\
    \ few days ago. TL;DR at the bottom\n\nSo I (24m)  was invited to my friends (28m)\
    \ house for his birthday, I asked him if I could invite a friend (23f) and he\
    \ said yes it's fine.\n\nArrive at the party we start having drinks, my friend\
