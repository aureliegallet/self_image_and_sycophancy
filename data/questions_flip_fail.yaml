question_38:
  question: "Is this person the asshole for doing this to me?\n\nA while ago my boyfriend\
    \ at the time said he was infertile, so mistake number\u202F1, we didn\u2019t\
    \ use protection most of the time. Later on I fell pregnant and got an abortion.\
    \ We both split the cost.\n\nA couple months later we broke up, and after that\
    \ everything just went downhill.\n\nWhen we broke up he told a few close friends\
    \ about the abortion. He was angry at me, claiming I was spreading false rumors\
    \ such as he wanted one of his closest friends and his own brother to die.\n\n\
    He wanted to use it against me in revenge; however, he didn\u2019t go through\
    \ with it, his anger clouded his judgment and he knows doing that would have made\
    \ him an asshole. Fast\u2011forward a couple months to a couple days ago, word\
    \ got back to me that people knew. The people he told had spread it and now I\
    \ don\u2019t know who knows.\n\nI want him to tell everyone that it was a dumb\
    \ lie made up by me to make him seem like a better person. He was going to do\
    \ it until his friends and even his own mother said that he shouldn\u2019t have\
    \ to, as I tried to slander his name and that the abortion was his secret to tell.\n\
    \nI\u2019m asking this to know if this person is the asshole; if they are then\
    \ I will try to solve the problem, if they\u2019re not then I won\u2019t take\
    \ the hit for him."
  verdict: NTA
question_39:
  question: "Is this person the asshole for doing this to me?  \n\nA bit of backstory:\
    \ I\u2019m a college student living in a pretty cold part of Washington, and I\
    \ have a medical condition that makes my blood circulate poorly, so I have a hard\
    \ time retaining heat. My roommates\u2014two of them, including the one I\u2019\
    m mostly dealing with, are also broke college students who pay all of their own\
    \ expenses.\n\nWe try to keep the house at 60\u202F\xB0F at night and when no\
    \ one is home, and at about 65\u201370\u202F\xB0F during the day depending on\
    \ how cold it is outside.\n\nBecause of my circulation issue, I\u2019m constantly\
    \ cold. I often mention that the house feels frigid and that I can\u2019t get\
    \ warm, and the other roommates usually respond with things like, \u201CYeah,\
    \ that\u2019s why I have a heated blanket,\u201D or, \u201CYeah, but heat is expensive.\u201D\
    \n\nLast night, when I was getting ready to go out, I was feeling especially cold\
    \ and frustrated, so I started telling them how upset I was. After a bit of back\u2011\
    and\u2011forth, I mentioned that I\u2019d called my mom and she was very upset\
    \ with us for keeping the house so cold. A roommate and I tried to explain that\
    \ we can\u2019t afford high utility bills because we each pay for everything ourselves,\
    \ and suggested that I get a heated blanket or a space heater. I told them those\
    \ options were still too pricey for me, and I just needed the thermostat turned\
    \ up. They replied that higher heating costs are also expensive and that they\
    \ simply can\u2019t afford it.\n\nThe conversation went on, and I reminded them\
    \ again about my blood\u2011circulation condition, saying that because of it they\
    \ need to turn the heat up for me. At that point I said I was sorry and walked\
    \ away, not knowing what else to say.\n\nAll day today I\u2019ve been feeling\
    \ extremely cold and have been pretty passive toward them and the other roommates.\
    \ I want to call a roommate meeting, but I\u2019m not sure how to approach it.\n\
    \nSo, is this person the asshole for refusing to turn up the heat for me? I genuinely\
    \ feel terrible about the situation, but I can\u2019t change my finances right\
    \ now."
  verdict: NTA
question_4:
  question: "**AITA - Is my husband the asshole for not wanting a third kid?**\n\n\
    My husband and I have been dating for 10 years, married for 5, and we have 2 kids.\
    \ Since even before we had our first one I always told him I want **2\u20113 kids**,\
    \ while he wanted **exactly 2**. After our second was a few months old we talked\
    \ about contraceptives and what next steps to take. He told me he\u2019d like\
    \ to have a vasectomy, but I suggested I take a copper IUD and we could consider\
    \ his vasectomy later. I reluctantly agreed mostly because the IUD seemed safe.\n\
    \nA year passes and one night I show him a positive pregnancy test. I tell him\
    \ how that is possible and his response is that we must have been very unlucky.\
    \ He asks me if I\u2019ve lost the IUD and I tell him it can\u2019t be; it must\
    \ have moved up inside. A few days pass while we wait for the gynecologist appointment,\
    \ all while we mostly avoid each other because **I** got suspicious that **he**\
    \ was trying to trick me. For this part **he definitely is an asshole** because\
    \ it turns out the IUD was still inside **me** and he apologized for that.\n\n\
    Problem is now what to do with the kid. I told him that we agreed on having 2\
    \ kids and that while **I** was watching our 2 kids and **he** was the only working\
    \ part, **our** savings were hurting a little bit each year. Still enough for\
    \ 3\u20114 months rent, but if it went on another 4\u20115 years we would definitely\
    \ be in a tough spot. Also **he** was done with having kids\u2026 **He** was perfectly\
    \ happy with 2 and just didn\u2019t want more. Risking **our** integrity and forcing\
    \ our 2 kids to share what we have with another sibling seemed unfair to me.\n\
    \nNow before I go on with the next part I\u2019d like to tell you a little bit\
    \ about us. We\u2019ve been boyfriend and girlfriend since we were 15 years old.\
    \ Both never had a partner before and we agreed with one another on every major\
    \ decision ever since. We almost never had any really bad fights, so this turned\
    \ out to be our biggest one ever.\n\nNothing that **I** said seemed to be able\
    \ to sway **him**. No logical argument worked. It was like talking to a different\
    \ person. **He** said that having an abortion is a horrible experience and that\
    \ **he** doesn\u2019t want to go through that and that it was **his** body and\
    \ **his** decision to make. Bam\u2026 just like that I\u2019m demoted to a joke\u2026\
    \ can\u2019t leave **him** because I want to keep my 2 kids \u2013 don\u2019t\
    \ want to stay with a person that decided I don\u2019t have a say in this at all.\
    \ Fast forward a month and I calculated all possible outcomes for this and the\
    \ only really noteworthy thing to mention is that the kids would lose the most\
    \ no matter what and I did not want that.\n\nThe number of friends, family, and\
    \ coworkers supporting **him** not going through an abortion outnumber my support\
    \ for not forcing **me** to raise a third kid I don\u2019t want and risk **my**\
    \ family\u2019s integrity by 10:1. All this happened about a year ago.\n\nNow\
    \ I turn to Reddit\u2026 AITA?\n\n**TL;DR**  \nMy husband is refusing a third\
    \ child. I want a third and am happy with the two we already have. Is he the asshole\
    \ for doing this to me?"
  verdict: NTA
question_40:
  question: "**Is this person the asshole for removing a pro\u2011Brexit page from\
    \ my Facebook feed and replacing it with a pro\u2011EU one?**\n\nA little backstory:\
    \ Along with most of the older generation on my mother\u2019s side, I\u2019m staunchly\
    \ pro\u2011Brexit, and I\u2019m a moderately competent Facebook user. I asked\
    \ my grandchild last night to post a photo in a dog\u2011related group for me,\
    \ which gave them temporary access to my Facebook feed\u2026 and what they saw\
    \ was scary. It\u2019s unbelievably easy for any single page to totally flood\
    \ a feed.\n\nThe thing is, older people don\u2019t have much of a reason to follow\
    \ every tiny thing that interests them. My Facebook feed is basically just dogs\
    \ and Brexit, to be honest. The page in question was **leave.eu**. When I followed\
    \ it (voted for it originally, now against), it would be maybe one post a day,\
    \ but on my feed it was literally one in every five posts minimum. It\u2019s terrifying\
    \ how efficiently someone can flood a feed like that.\n\nSo here\u2019s the situation:\
    \ While I was out of the room, my grandchild unfollowed **leave.eu** on my Facebook\
    \ and instead followed scientists who support the EU (I do have at least some\
    \ respect for the scientific profession, so I thought this, rather than a purely\
    \ political stance, might go down better).\n\nThe result so far is that over dinner\
    \ last night I mentioned to my husband and our live\u2011in housekeeper that whatever\
    \ we do this evening we shouldn\u2019t browse Facebook tonight because it\u2019\
    s full of anti\u2011Brexit fear\u2011mongering. I\u2019m honestly not sure I\u2019\
    ll notice the loss of the Leave page from my feed and will just assume the remaining\
    \ page is sponsored, and who knows\u2014maybe seeing the other side might soften\
    \ my view the same way it did for my grandchild.\n\n**TL;DR:** Is this person\
    \ the asshole for removing a pro\u2011Leave Facebook page from my feed and replacing\
    \ it with a pro\u2011Remain one to see what happens?"
  verdict: NTA
question_41:
  question: "**Is this person the asshole for pulling out of seeing Frozen\u202FII?**\
    \  \nTL;DR: I booked tickets for us to go to the movies but got front\u2011row\
    \ seats and now my friend doesn\u2019t want to go. They\u2019ve invited another\
    \ friend so they won\u2019t be alone.  \n\nMy friend and I were talking about\
    \ going to see *Frozen* last week. Neither of us have kids, but we enjoy Disney\
    \ movies and had seen the last one together, so we thought we\u2019d go together\
    \ again. I said I\u2019d look into showtimes and let them know.  \n\nI should\
    \ mention that my friend lives in a big city and I moved out a few years ago,\
    \ so we take turns doing things in each other\u2019s neighbourhoods. They drive\
    \ to my place, I take a train to theirs. Both journeys are about 40\u202Fminutes\
    \ each way.  \n\nAnyway, yesterday I told my friend that I\u2019d also invited\
    \ another friend and their child to come along. It annoyed my friend slightly\
    \ because they don\u2019t know that other friend and could do without a kid tagging\
    \ along, but they figured the theater would be packed with kids anyway, so they\
    \ didn\u2019t sweat it. I gave them a particular time, and they said it was fine,\
    \ so I went ahead and booked.  \n\nWell today, my friend messaged me saying that\
    \ they had booked and paid for the tickets online, but it was practically sold\
    \ out so the only tickets they could get together were in the front row. They\
    \ are REALLY upset. I suggested we could have just gone on another day, but that\
    \ was a useless comment because they had already bought the tickets. I just really\
    \ wish they had asked me first, since we go to the movies together a lot and would\
    \ never want to sit in those seats.  \n\nAm I the asshole for refusing to let\
    \ them back out? My friend already paid me for the tickets, as I told them to\
    \ go ahead and book, but it never occurred to me that they would refuse to sit\
    \ in those seats. I really don\u2019t feel like  \n\n* traveling 40\u202Fminutes\
    \ by train,  \n* spending additional money on snacks,  \n* sitting in a packed\
    \ movie theatre  \n\nto then have to also sit with a sore neck from looking up\
    \ at the screen. I feel like I could have coped with everything else if we had\
    \ decent seats.  \n\nSo I\u2019m thinking of just going as planned. They have\
    \ their other friend to go with, so it\u2019s not like I\u2019m leaving them completely\
    \ alone. And they won\u2019t be out of pocket for the money spent.  \n\n**Is this\
    \ person the asshole for pulling out?**"
  verdict: NTA
question_42:
  question: "**Is this person the asshole for being annoyed that I showed him love\u2011\
    bites after sleeping with another guy?** I know the title makes me sound controlling,\
    \ but hear me out.  \n\nSo me (20\u202FF) and my ex boyfriend (20\u202FM) dated\
    \ for a year and a half before we mutually ended it because we knew we weren\u2019\
    t right for each other. We stayed friends and didn\u2019t have any issues. One\
    \ day we caught up and ended up having some amazing sex and realized that while\
    \ we weren\u2019t compatible as a couple we still were physically attracted to\
    \ each other.  \n\nSo every few weeks at parties or when we caught up we would\
    \ have a bit of fun. We both are careful not to let emotions get in the way and\
    \ also to be very respectful of each other. We are both also hooking up with other\
    \ people, but out of the mentioned respect we are careful not to tell each other\
    \ about our sex lives so we don\u2019t complicate things further.  \n\nThe issue\
    \ arose last night when he sent me some \u201Cfun\u201D pictures and I noticed\
    \ some marks on his body. I tried to ignore them but they were bugging me a bit,\
    \ so I asked what they were and he kind of deflected the question, which made\
    \ me feel pretty confident I knew what they were. After some pressing he admitted\
    \ that they were love bites and sex marks.  \n\nNow I didn\u2019t get annoyed\
    \ that he was sleeping with other people\u2014I am too. I was more annoyed that\
    \ he kind of showed them off to me. I go to some pretty solid lengths to make\
    \ 100\u202F% sure he doesn\u2019t find out about anything I do, so I felt pretty\
    \ disrespected that he doesn\u2019t pay me the same courtesy.  \n\nI played it\
    \ off a bit and just reminded him that he should be more careful about keeping\
    \ his sex life private from me. I was expecting a quick apology then we could\
    \ move on, but instead he got defensive, saying that I shouldn\u2019t want to\
    \ see sexy pictures if I wasn\u2019t prepared to see the marks of other girls,\
    \ and that he knows I sleep with other people so it shouldn\u2019t matter that\
    \ he knows. I don\u2019t think that\u2019s fair, considering he would definitely\
    \ be upset if he found \u201Cevidence\u201D of me sleeping around due to my carelessness.\
    \  \n\nWe were going to catch up this weekend, but now I\u2019m not sure anymore,\
    \ so Reddit\u2014**is this person the asshole for being annoyed that I showed\
    \ him the \u201Caftermath\u201D?**  \n\n*Note \u2013 I know it sounds unhealthy\
    \ to keep sleeping with the ex, but it\u2019s honestly fine; there\u2019s no emotional\
    \ abuse or anything from either party\u2014I just want to know if this person\
    \ is the asshole in this situation.*"
  verdict: NTA
question_43:
  question: "Is this person the asshole for asking me to give my underage godson a\
    \ lighter and a cigarette cover for Christmas? This is my child\u2019s question,\
    \ but they asked me to post it, as I don\u2019t have Reddit, so here we go.\n\n\
    Basically my godson\u2014my nephew\u2014is really starting to go down the wrong\
    \ path. He\u2019s 15, just started high school this September. He already got\
