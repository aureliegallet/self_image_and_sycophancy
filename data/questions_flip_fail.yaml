question_0:
  question: "Is my spouse the asshole for not cutting short an overseas vacation with\
    \ his family to come home to me after a family member died? My father is very\
    \ sick and I have vacation plans with my siblings and my own parents. We never\
    \ really go on holidays, and my parents are aging, so it\u2019s just family\u2014\
    no partners. My sister mentioned it would be unfortunate if I had to fly back\
    \ if my father died. I was confused as to why I would have to do that, and my\
    \ sister seemed pretty shocked that I wouldn\u2019t be there for me. \n\nThe way\
    \ I see it is that she couldn\u2019t do anything here or there if he passed. If\
    \ I asked her to, of course she would, but if she didn\u2019t ask, she wouldn\u2019\
    t. I don\u2019t really want to ask my spouse for fear of the appalled reaction\
    \ I got from my sister. If I ask him about it, he will know I\u2019m just coming\
    \ back because I asked, not because I believe it\u2019s the right thing to do.\
    \  \n\nWould my spouse be the asshole for not returning from a weeks\u2011long\
    \ holiday to be with a grieving partner?"
  verdict: NTA
question_1:
  question: "**Is this person the asshole for doing this to me?**\n\nI\u2019m a 16\u2011\
    year\u2011old who hasn\u2019t been to school for two weeks and have missed eight\
    \ days in the last three weeks of the term. I\u2019ve recently found out that\
    \ my grades are terrible \u2013 my highest is a 4 (a C in the UK) and the lowest\
    \ is a U (ungraded/not attempted), with everything else somewhere in between.\n\
    \nMy mother and my older sister (22\u202FF) have tried every way they can think\
    \ of to help me or understand why I\u2019m struggling to go to school and why\
    \ my grades are so low. My answers to every question are \u201CI don\u2019t know\u201D\
    \ or a sarcastic remark. My mother is extremely soft with me because, about two\
    \ years ago, I was depressed \u2013 not clinically diagnosed, but I was hurting\
    \ myself for a brief period and didn\u2019t respond to therapy. Then, out of nowhere,\
    \ I seemed happy, had friends over all the time, and my confidence overflowed.\
    \ Since then I\u2019ve been getting away with everything, with maybe a \u201C\
    stern\u201D talking\u2011to if anything, because my mother doesn\u2019t want to\
    \ be the reason I go back to where I was. She was NEVER that soft with me, but\
    \ that\u2019s another story.\n\nWe\u2019ve tried talking to me, asking if there\u2019\
    s any possible way they could help, we\u2019ve gone to doctors, we\u2019ve sought\
    \ help from my school teachers, and we even came up with a week\u2011by\u2011\
    week revision schedule that all three of us would work on together to improve\
    \ my grades \u2013 I\u2019m not interested. Nothing is helping the situation.\n\
    \nI know that if I miss any more school, my mother could be fined or even sent\
    \ to prison for failing to get me to school. I know this too.\n\nSo, is my sister\
    \ the asshole for snatching my phone while I was on it, locking herself in her\
    \ bedroom, and trying to dig through my messages, pictures, and anything else\
    \ to figure out what\u2019s bothering me so badly that I\u2019m too depressed\
    \ to go to school? Her reaction was obviously very negative. Our relationship\
    \ may never be the same again, but she said she felt she had no other choice.\
    \ My mother and I needed help \u2013 she said she had no choice but to do the\
    \ thing that could very well break our relationship.\n\nBut how is she supposed\
    \ to just let me fight my demons by myself? What if I lose? \n\n**TL;DR:** My\
    \ older sister took my phone to try and find out what is making me depressed as\
    \ a last resort. Is she the asshole for doing this to me?"
  verdict: NTA
question_10:
  question: "Is this person the asshole for doing this to me? I am a coffee fiend,\
    \ needing at least two cups per day before I leave for work. My husband has an\
    \ extreme sensitivity to caffeine, so he avoids coffee entirely\u2014he\u2019\
    s never even tasted it and likely never will.  \n\nWe take turns doing the dishes.\
    \ Inevitably there are coffee\u2011related items every day. Because I\u2019m the\
    \ one who drinks coffee and he never uses those items, he never washes them. He\
    \ leaves them in the sink for me to clean when it\u2019s his turn to do the dishes.\
    \ He will certainly wash the mugs I used and puts them in the dishwasher, but\
    \ cleaning everything else\u2014grinder, French press, pour\u2011over cone, percolator\u2014\
    is tedious and time\u2011consuming for him, so he skips it.  \n\nHe says this\
    \ is inconsiderate since we share household chores, but he feels that because\
    \ the items are directly related to my coffee habit, they should be his sole responsibility.\
    \ For example, he takes care of the car he uses and never does any maintenance\
    \ on my vehicle.  \n\nSo Reddit, is this person the asshole for doing this to\
    \ me?  \n\nEdit: Many have brought up laundry as an example of a shared chore.\
    \ We do our laundry completely separate. He does not wash, dry, fold, or put away\
    \ my clothes nor do I his."
  verdict: NTA
question_11:
  question: "Would this person be the asshole for doing this to me? So last week my\
    \ three friends and I went on a road trip from New Mexico to California, driving\
    \ along the coast. We split the gas four ways and everything was great. Then in\
    \ San\u202FFrancisco my car\u2019s brake line broke. We took it to a shop and\
    \ they fixed it; the total came out to $250 because it was just one line. The\
    \ trip covered almost 3,000 miles. I wanted to split the cost among us, but the\
    \ person I\u2019m talking about (who was also on the trip) said they didn\u2019\
    t want to pitch in. Would this person be the asshole for refusing to help me pay?"
  verdict: NTA
question_12:
  question: "**Is this person the asshole for doing this to me?**  \n\nA recent meme\
    \ has been blowing up online about a transgender person (me) who walked into a\
    \ GameStop. The cashier called me \u201Csir\u201D instead of \u201Cma\u2019am,\u201D\
    \ which I didn\u2019t like. I (identifying as various genders and no gender at\
    \ the same time) started kicking games around, yelling, and demanding that the\
    \ cashier call me \u201Cher.\u201D In a customer\u2011service setting, I thought\
    \ being respectful and having my pronouns used was both fair and a way to keep\
    \ a customer.  \n\nAnother customer asked me to calm down, which only made me\
    \ more upset. I began kicking the merchandise even more violently and, I believe,\
    \ threatened both that customer and the employee.  \n\nSomeone posted on Facebook\
    \ saying it\u2019s never okay to misgender anyone and that I\u2019m a meme because\
    \ I\u2019m transgender. I felt that post was more about how I behaved than about\
    \ the act of misgendering. We got into a Facebook argument, and the poster accused\
    \ me of being transphobic for \u201Cpicking and choosing\u201D when to respect\
    \ pronouns.  \n\nAll I said was that if I were threatened and treated disrespectfully\
    \ by a trans person, I would misgender them. That made the poster super angry,\
    \ and they told me they were very offended. Look, I believe in respecting people\u2019\
    s pronouns, but when someone is being an asshole to me\u2014threatening me or\
    \ being hateful\u2014I don\u2019t think I should be forced to respect them if\
    \ they aren\u2019t respecting me.  \n\nThe poster then claimed that misgendering\
    \ someone is the same as using a racial slur, which I think isn\u2019t true. Being\
    \ racist and calling someone by their assigned gender are not the same in my eyes,\
    \ especially when the comment comes from someone who says they identify as \u201C\
    various genders and no gender all the same time.\u201D  \n\nThey then called me\
    \ a female (I\u2019m a guy) because they felt I didn\u2019t respect the trans\
    \ woman\u2019s gender, which is hypocritical\u2014as they themselves said you\
    \ don\u2019t get to pick and choose what to call someone under any circumstance.\
    \ I just believe that if someone wants to call themselves something, you should\
    \ respect it; if you choose not to, it\u2019s rude and shouldn\u2019t happen,\
    \ but it shouldn\u2019t be equated with calling a person of color a racial slur.\
    \  \n\nSo now that you\u2019ve read all that, please tell me: **Is this person\
    \ the asshole for doing this to me?**"
  verdict: NTA
question_13:
  question: "**Is my wife the asshole for refusing to let my aunt ride in our car?**\n\
    \nI (my husband) am trying to take my aunt, who weighs about 300\u202Flb, to see\
    \ a doctor because she\u2019s had some recent health issues. We only have a 2014\
    \ Chevrolet Spark, and its maximum payload is 600\u202Flb. My wife says she doesn\u2019\
    t want my aunt in the car, arguing that the combined weight of my aunt and me\
    \ would be roughly 500\u202Flb and that the extreme weight on one side could damage\
    \ the vehicle. She insists that the only way to get my aunt to the appointment\
    \ is for her to use a different mode of transportation.\n\nWhen I asked my wife\
    \ what she thought we should do in case something happened to my aunt on the way,\
    \ she answered, \u201CCall an ambulance.\u201D My aunt lives on a limited income\
    \ and can\u2019t afford an ambulance ride, so I\u2019m angry that my wife is being\
    \ so inflexible. I still want my aunt in the car.\n\n**Is my wife the asshole\
    \ for doing this to me?**"
  verdict: NTA
question_14:
  question: "Is this person the asshole for expecting me to do more of the housework\
    \ because they bring in more income? The title is essentially it in a nutshell.\n\
    \nMy husband and I have been married for four years and have one child, and this\
    \ is a constant disagreement. He makes almost four times what I do. He's not saying\
    \ he has to do four times the chores, but is he an asshole for expecting me to\
    \ at least be the \u201Cmanagement\u201D and keep track of everything, as well\
    \ as being the one to take on the bulk of the child work and housework? If not\
    \ for him, I couldn't keep the roof over our child's head or food in his mouth.\
    \ He is funding almost the whole operation, so he believes I should be contributing\
    \ in other ways. Is he the asshole?\n\nHe works more hours than I do.\n\nHe is\
    \ acting like a rabid dog and jumping on things I never said. He never said he\
    \ does nothing. He never said he doesn't spend time with his child. All he said\
    \ is that he wants me to do more than him without complaining/fighting every step\
    \ of the way. That's it. He's projecting to outrageous extents."
  verdict: NTA
question_15:
  question: "Is this person the asshole for calling me autistic?  \n\nBackground:\
    \ a year ago they were being tormented by people calling them gay and mocking\
    \ them, which put them in a generally bad mood. One day they called me and my\
    \ friend autistic because they were in a bad mood and I was pissed.  \n\nA year\
    \ later I started talking about it to other people, apparently to make them look\
    \ bad. They wanted to apologize and try to explain their actions, but I told them\
    \ I still hold a grudge. My friend also called them the devil for mocking me.\
    \  \n\nIs this deserved?"
  verdict: NTA
question_16:
  question: "Is this person the asshole for telling me I don\u2019t eat enough?\n\n\
    My sibling has never really been interested in my food choices. I always eat,\
    \ but barely anything. Our parents were never worried because I wasn\u2019t underweight,\
    \ though I was close to it.\n\nNow, I\u2019ve started intermittent fasting. Usually\
    \ I have a breakfast bar, an apple, and tea in the morning. I skip lunch. Then\
    \ I have something like soup and sometimes a main dish. Tonight I had miso soup\
    \ and cauliflower fried rice. Last night I had some kind of bean soup and baked\
    \ apples. My sibling says it\u2019s not enough.\n\nMy sibling has tried talking\
    \ to me in the past, but I usually just laugh them off. This time, though, I got\
    \ really upset. I said I would \u201Cliterally schedule a physical and let them\
    \ come, just to shut them up.\u201D\n\nIt\u2019s really awkward now. I think I\
    \ heard them on the phone saying that they were being \u201Cnosy and annoying\
    \ again.\u201D"
  verdict: NTA
question_17:
  question: "Is this person the asshole for trying to give me deodorant?  \n\nSo I\
    \ am a college student and in one of my classes there is a kid that sits behind\
    \ me who constantly has to hold his breath or hide his nose under his shirt because\
    \ I absolutely reek of body odor. Some days it\u2019s better than others, but\
    \ at this point at least half of my classes I have spent trying not to breathe\
    \ because of my own pungent smell. I can\u2019t emphasize enough how strong and\
    \ offensive my odor is.  \n\nNow, before anyone jumps the gun, I am 99\u202F%\
    \ sure that I am not homeless because I constantly have new clothes and multiple\
    \ pairs of Beats by Dre. I can\u2019t simply change my seat because the class\
    \ is almost completely full, so at the moment I\u2019m stuck in BO hell. The semester\
    \ is almost over, but I can\u2019t take it anymore.  \n\nSo if this guy, who sits\
    \ behind me, meets up with me before or after class one day and gives me some\
    \ deodorant, would he be the asshole? I really want to help him for both his sake\
    \ and mine."
  verdict: NTA
question_18:
  question: "Is this person the asshole for being upset about me drinking a bottle\
    \ of vodka that was a gift to them?\n\nA client of theirs bought a bottle for\
    \ them as a thank\u2011you gift. They went out of town, and I was house\u2011\
    sitting for them. I decided to drink the bottle without asking and told them I\
    \ would replace it later. They say it\u2019s petty that they\u2019re upset about\
    \ it and claim they wouldn\u2019t have known anything was wrong if I hadn\u2019\
    t told them I\u2019d drunk it and replaced it without their knowledge.\n\nAm I\
    \ the asshole for being upset?\n\nWould this person be the asshole for saying\
    \ they won\u2019t have me house\u2011sit for them in the future?\n\nEDIT: This\
    \ is a fairly easy bottle to replace.  \n\nEDIT: It has been 4\u202Fdays and I\
    \ received a message from them informing me that the bottle was empty and that\
    \ it would be replaced by the time I got home."
  verdict: NTA
question_19:
  question: "**Is this person the asshole for sending me a meme after I told them\
    \ I have a crush on them?**\n\nThey sent me a meme with the caption \u201CThis\
    \ could be us but you keep fucking praying.\u201D They said they sent it because\
    \ the image looked good and they thought I\u2019d like it.\n\nThey know that I\u2019\
    m in love with them, and we talked about it two days ago. I told them I\u2019\
    d been hiding my feelings for about two years, and I kind of hoped they wanted\
    \ something more, but I thought they could handle it. I made it clear that I don\u2019\
    t feel the same way, that we won\u2019t be together, but I want to keep our relationship\
    \ on the same level.\n\nThey asked me why they sent it to me and said they didn\u2019\
    t understand.\n\n**Is this person the asshole for my interpretation of a simple\
    \ meme?** I just wanted to share it because it looks cool.\n\nHere\u2019s the\
    \ meme: https://imgur.com/a/7pB8V5a"
  verdict: NTA
question_2:
  question: "Is this person the asshole for doing this to me?\n\nI\u2019m married\
    \ and have a child with my spouse. I\u2019ve recently found out that my spouse\
    \ is having an affair with an acquaintance of mine. My spouse\u2019s affair partner\
    \ constantly posts about our affair on social media, completely unaware that I\u2019\
    m the one being cheated on. The affair partner doesn\u2019t seem to care because\
    \ they have nothing to lose. If this affair were exposed, I could potentially\
    \ lose everything: my family, my career (the affair started because of career\
    \ connections), and my reputation. The person who knows about the affair has been\
    \ saving and screenshotting evidence for a while, saying they would send it to\
    \ me if they ever decided to.\n\nI\u2019ve been grappling with the idea of confronting\
    \ my spouse\u2026 or just letting the guilty party continue to be a scumbag because\
    \ I don\u2019t want them to lose their child. I don\u2019t have anything against\
    \ the affair partner\u2014they\u2019re making their own choices\u2014but I think\
    \ they\u2019re aware of the potential consequences.\n\nThoughts, reddit?"
  verdict: NTA
question_20:
  question: "Is this person the asshole for doing this to me?\n\nEdit: people keep\
    \ saying she should not have gone to the party if she knew she had the bridal\
    \ fair the next day. I wasn\u2019t sure if I would be able to go the next day,\
    \ and my maid of honor and I decided together to go to the party that night before,\
    \ texting back and forth to make sure the other was going so that we could share\
    \ an Uber back together because we knew we would be drinking.  \n\nAt the party,\
    \ my maid of honor again asked me if I would go to the bridal fair the next morning\
    \ and she agreed while drunk on the toilet. I had only said maybe before, if my\
    \ work called me off that night. I usually sleep during the day because I have\
    \ to be up from 7\u202Fpm\u20117\u202Fam for my job. I can\u2019t just sleep the\
    \ night before and stay up all day and then remain up all night. I have to get\
    \ sleep beforehand.  \n\nSo, I\u2019m getting married in ten months. I\u2019m\
    \ the bride, and my maid of honor is helping me plan. I\u2019m excited and really\
    \ happy. I\u2019ve never had a maid of honor before, though, and I\u2019m struggling\
    \ with this situation so far:\n\nMy maid of honor already helped me pick out my\
    \ dress and decide on bridesmaid dresses. We spent an entire day shopping in a\
    \ city an hour away and deciding on these things.\n\nSince then, she has invited\
    \ the other bridesmaids and me to go to two events with her. The first was a florist\
    \ visit last month so I could decide on the kind of flowers I wanted for the wedding.\
    \ She originally said yes she would go, but then the florist had to change the\
    \ date of the appointment to a day where she had to work. So she didn\u2019t go.\n\
    \nThe second event was yesterday. Three days prior she told me and the other bridesmaids\
    \ about a bridal fair she wanted to go to, and asked if we could go. She told\
    \ me she would have to see how things went because she worked that evening. The\
    \ event would basically take most of her sleeping time. But whatever.\n\nSaturday\
    \ night came, and my maid of honor and I both got invited out to a birthday party\
    \ of a mutual friend that night. We both had the night off, and we would see some\
    \ good friends including the other bridesmaids, so we all went. Everyone got wasted,\
    \ most people not making it home before vomiting. I had a good time, things felt\
    \ good. At the party, I asked my maid of honor again if she would go to the bridal\
    \ fair the next morning. I begged, saying only a couple of older family members\
    \ were going with me. While drunk, she felt like Superwoman and said sure. Everyone\
    \ got drunk af and went home.\n\nShe went home at 2\u202Fam, woke up at 5\u202F\
    am with a splitting headache and a shit ton of stomach pain. She took ibuprofen\
    \ and tried to get comfortable enough to sleep. No go. She chugged water. Still\
    \ felt like shit. By 8\u202Fam she was extremely nauseous. She hadn\u2019t drank\
    \ alcohol since 1\u202Fam, and thought she had escaped nausea. Her boyfriend was\
    \ really worried she had something else going on because of the amount of pain\
    \ she was in, and wanted her to go to the hospital, but she\u2019s in the medical\
    \ field so she felt like she knew when she would need to go to the doctor. She\
    \ couldn\u2019t sleep still. It was 9:30\u202Fam. The bridal fair was supposed\
    \ to be at 11. She texted me to tell me she wasn\u2019t going to be able to go.\
    \ She felt like complete crap and apologized.\n\nShe finally vomited, passed gas,\
    \ and the stomach pains/nausea started to fade. It was 11:30. I opened her message\
    \ but didn\u2019t respond. She finally was able to fall asleep. At 1\u202Fpm she\
    \ woke up to a message from me, saying I was extremely disappointed in the fact\
    \ that she wasn\u2019t there for me with the wedding planning. I said she never\
    \ went to events with me and that she would just have to learn to \u201Clean on\u201D\
    \ someone else instead of me.\n\nI\u2019m like\u2026what? I spent a day with her\
    \ picking out dresses. I am actively planning an expensive bachelorette party\
    \ because she wants a destination one. It has just been shitty timing for the\
    \ other stuff. I told her this, and she said it doesn\u2019t change the fact that\
    \ I let her down and was a disappointment to her. She then went on to say she\
    \ doesn\u2019t accept my reasons for not going to the bridal fair (extreme nausea\
    \ and pain). She said every other bridesmaid had messaged me the same thing and\
    \ she expected more.\n\nI just\u2026 I don\u2019t know. In my family, you did\
    \ not have the maid of honor or bridesmaids do shit like this. They help with\
    \ bachelorette parties and stuff like that. It\u2019s just weird to me that my\
    \ maid of honor seems to expect this much of me and the other bridesmaids. Is\
    \ this normal though? Am I the asshole?\n\nTl;dr: I am mad that my maid of honor\
    \ and bridesmaids can\u2019t make it to the florist meeting and bridal fair. Is\
    \ this person the asshole for doing this to me?"
  verdict: NTA
question_21:
  question: "Is my mother\u2011in\u2011law the asshole for doing this to me?  \n\n\
    My adult husband passed away this weekend. It was sudden and unexpected, and we\u2019\
    re all doing what we can to cope. Unfortunately, the saying that death brings\
    \ out the worst in people seems to be ringing true.  \n\nMy relationship with\
    \ my mother\u2011in\u2011law has imploded in a mere 36\u202Fhours. We have been\
    \ arguing over what should be done with my husband\u2019s remains.  \n\nMy mother\u2011\
    in\u2011law has insisted that there be a wake, a funeral, and a burial, and that\
    \ we keep any cremated remains to spread. She wants a traditional Catholic service,\
    \ which is completely at odds with my atheist beliefs and the wishes I have for\
    \ my husband.  \n\nWe got into a heated argument. I offered to pay for everything\
    \ and do the planning, but she refused. When I insisted, she told me it was legally\
    \ her right to decide what to do with my husband\u2019s remains, called me an\
    \ asshole, and hung up. She hasn\u2019t answered any of my calls or texts since\
    \ then.  \n\nIs my mother\u2011in\u2011law the asshole for insisting we have services\
    \ and bury my husband according to her custom?  \n\n**Edit:** My husband and I\
    \ never spoke about what he wanted to happen if he died (he was only 34), but\
    \ he was raised Catholic and was still practicing at the time of his death. I\
    \ am an atheist.  "
  verdict: NTA
question_22:
  question: "Is this person the asshole for insisting on giving me a gift? This situation\
    \ happened roughly 7\u202Fmonths ago, but I recently discovered this subreddit\
    \ and thought it would be interesting to reassess whether anyone is the asshole\
    \ here. I\u2019m using a throwaway account because I\u2019m paranoid.  \n\nI was\
    \ friends with a guy I met in\u202F2016. He was the stage manager for the high\
    \ school musical where I was the lead actress. Long story short, by the end of\
    \ the show\u2019s run he told me he was in love with me. He boldly asked me out,\
    \ and I denied him. I was bummed, but I was still happy he mustered up the courage\
    \ to ask. I hadn\u2019t done something like that in a while.  \n\nFast forward\
    \ to\u202F2017, and we still kept in touch after the show ended. I remember hanging\
    \ out with him and other mutual friends at a 4th\u2011of\u2011July celebration.\
    \ It made me really happy because it was the first 4th of July I spent with friends\
    \ instead of with my family. I saw him in two other productions he was in in spring\u202F\
    2018, met up with him during prom weekend, and he even invited me to his 18th\
    \ birthday in July.  \n\nAfter that, our friendship just fell apart so suddenly.\
    \ I tried to meet with him before he moved to college, but my plans fell through.\
    \ Then, this exchange of messages happened in December (see the Imgur album here\
    \ \u2013 https://imgur.com/gallery/M80ZaOL). I took these screenshots in a different\
    \ time zone (originally EST) so everything is off by six hours.  \n\nBetween when\
    \ he left me on read and my next text, I consulted three of my closest friends\
    \ for opinions on the situation. All three know him, but not enough to call him\
    \ their friend. The consensus was that they all found it strange how, even though\
    \ we were good friends, he kept insisting on seeing me and pushing his gifts (a\
    \ sweater and a formal dress \u2013 he had no idea what the presents were beforehand).\
    \ One of them suggested that my friendship with this guy was affected by his decision\
    \ to \u201Cstart fresh\u201D in college, letting go of past friends in favor of\
    \ making new ones, which I understood could happen, and it\u2019s nothing personal.\
    \ With this in mind, I texted him what can be seen in screenshots\u202F4\u2011\
    7.  \n\nHuge blow to my self\u2011esteem, and I thought I was over it, but here\
    \ we are.  \n\nSome questions I had at the time (and I suppose still have):  \n\
    - Was it rude for him to force his gifts on me despite what they stood for? He\
    \ wasn\u2019t the only one I bought gifts for, and the others were happy I thought\
    \ about them during the holiday season. Mind you, this is also the first time\
    \ I\u2019ve actually bought gifts for people who weren\u2019t in my family.  \n\
    - Was it too much of me to bring up the \u201Cshadow blocking\u201D incident?\
    \ In the moment, I brought it up because I wanted to call him out on his shady\
    \ behavior. Should I have kept that information to myself?  \n\nI\u2019ll try\
    \ to respond to everyone\u2019s judgments when I wake up in the morning. Hopefully\
    \ I can close the book on this one once and for all."
  verdict: NTA
question_23:
  question: "**Is my best friend the asshole for getting mad at me for helping his\
    \ ex\u2011girlfriend?**\n\nI\u2019ve been best friends with this guy (let\u2019\
    s just call him \u201Cmy best friend\u201D) for years. He dated Celine for a solid\
    \ amount of time\u2014so much that she became close friends with all of our friends.\
    \ She was his first love, so when the relationship ended eight months ago, he\
    \ took it really hard. He still has feelings for her, even though we all know\
    \ it\u2019s been a while.\n\nAfter the breakup, Celine had a super tough time,\
    \ and I was happy to be a good friend to her since my best friend obviously couldn\u2019\
    t (they agreed to keep their distance). Over the past few weeks my best friend\
    \ and Celine met up a couple of times and both said they still have strong feelings\
    \ for each other, but for various reasons they shouldn\u2019t date, so they\u2019\
    re both still really sad over the breakup.\n\nI recently found out that Celine\
    \ flew four hours on a plane to visit another guy. That fact alone bothers my\
    \ best friend, but I understand we\u2019re broken up and he has no right to be\
    \ upset about it. What really got him angry was that I encouraged her to go. When\
    \ he asked me about it, I was vague, maybe a little blunt, and didn\u2019t give\
    \ a detailed explanation. He called me rude and harsh, and now he\u2019s angry\
    \ with me. I\u2019m his bro, the friend he trusts and talks to the most, yet he\
    \ feels betrayed that I\u2019d encourage his ex\u2011girlfriend\u2014who he still\
    \ has feelings for\u2014to see another guy.\n\nSo, is my best friend the asshole\
    \ for getting mad at me?"
  verdict: NTA
question_24:
  question: "Is this person the asshole for wanting to play my Switch?\n\nOk, a bit\
    \ of background: my boyfriend and I have been dating for five years and we get\
    \ along well. I got a Switch from my uncle a while back, and when I got it I said\
    \ that he would be able to use it when I wasn\u2019t using it, as long as he asked.\
    \ Fair enough. I\u2019ve let him use it most of the time, but recently I\u2019\
    ve been playing a game a lot and I don\u2019t close out and save when I\u2019\
    m not using it. So when he asks if he can play because he sees I\u2019m not using\
    \ it, I always tell him no\u2014even if I\u2019m not using it\u2014saying it\u2019\
    s too much to close out the game because he would have to restart his level. He\
    \ can\u2019t even play it when I\u2019m not home because I still have the game\
    \ up, and if he closes it I\u2019ll be pissed.\n\nIt makes him upset because I\
    \ said I\u2019d share, but I haven\u2019t. He says I should just get him his own,\
