question_34:
  question: "Would this person be the asshole for not signing the Mother\u2019s Day\
    \ card?  \n\nSo basically I have been cheating on my husband for two years (as\
    \ far as I\u2019m aware) and my child has confronted me about it at least ten\
    \ times by now, even presenting evidence to me, and I always deny it, give the\
