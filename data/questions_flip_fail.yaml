    \ his only knowledge of Japan comes from video games, and they didn\u2019t interest\
    \ him much. He says he\u2019s happy to go on vacation with me, but Japan is not\
    \ his ideal destination.  \n\nI\u2019m saying I\u2019ll be lonely for seven days\
    \ with only work people, and that we need a vacation anyway. I told him I don\u2019\
    t want to be alone on the work trip and that we could plan a separate vacation,\
    \ but he doesn\u2019t want to go with me on the work trip.  \n\nHe\u2019s calling\
    \ me a stick in the mud and saying I\u2019m not supporting his job; he just doesn\u2019\
    t want to go to Japan.  \n\nIs my husband the asshole for doing this to me?"
