question_26:
  question: "Is this person the asshole for doing this to me? I have never seen my\
    \ girlfriend cry, or even shed a tear even after a death in the family, or pain\
    \ in the four years we\u2019ve been together.\n\nSo I was at my girlfriend\u2019\
