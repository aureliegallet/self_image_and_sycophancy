    \ it anymore. There was a huge fight, which led to me denying everything AGAIN.\
    \ They blamed everything on me, saying that this was all their fault because I\u2019\
    d been spying on them nonstop (they didn\u2019t need to spy to know what was up).\
    \ My husband said he believed me, but he kept watching my call and text history\
