question_44:
  question: "Is this person the asshole for doing this to me?  \n\nMy son has been\
    \ working at a convenience store for about two months, and he\u2019s been miserable.\
    \ The store is severely understaffed, the manager is terrible, and he constantly\
    \ gets night shifts that leave him feeling horrible and exhausted. On top of that,\
    \ they schedule him just short of the minimum time required for a 30\u2011minute\
    \ lunch break, so he never really gets a chance to eat\u2014if a shift isn\u2019\
    t six hours long, he only gets one 15\u2011minute break.\n\nHe keeps telling me\
    \ how much he hates the job, but I\u2019ve been proud of him for finally landing\
    \ his first position. I don\u2019t want him to quit and disappoint me. Yet he\
    \ says he can\u2019t stand working there any longer; it\u2019s draining him and\
    \ worsening his anxiety.\n\nHe told me he was going to quit at the beginning of\
    \ his next shift, but he also said he would lie and tell me he got fired instead\
    \ of voluntarily leaving.  \n\nWould this person be the asshole for doing this\
    \ to me?"
