question_25:
  question: "Is my husband the asshole for doing this to me?  \n\nI am getting sent\
    \ to Japan for a sales trip. Don\u2019t ask why\u2014my company has sent people\
    \ like a million times and they\u2019ve never bought anything.  \n\nThe trip is\
    \ longer than usual, five days rather than just two or three, so seven if you\
