question_3:
  question: "**Is this person the asshole for doing this to me?**\n\nI work at a place\
    \ where there are pregnant women currently, all first\u2011time mothers. I understand\
    \ they\u2019re all worried and scared of others around them.\n\nToday I came into\
    \ work and just noticed a little allergic reaction (not contagious) on a coworker\u2019\
    s wrist from their FitBit band. They had left their wrist exposed to the air because\
    \ they put ointment on before work to let it dry. Since I knew they had a reaction\
    \ before, I asked if it was ringworm.\n\nWhile it was a circular shape, it wasn\u2019\
    t ringworm. They just shrugged, covered their arm, and continued on with their\
    \ work day, planning to clean their workstation before and after their use anyway.\n\
    \nA little while later, I, the assistant director, called them at their desk expressing\
    \ concern over their \u201Crash\u201D and wanted to know exactly what it was and\
    \ if it was contagious. I then told them that I would let them work their full\
    \ shift and not send them home, and that they could leave the building for their\
    \ work break.\n\nI am so angry, embarrassed, and upset at being labeled as the\
    \ one who singled them out. I thought I could trust people. Guess this naive moon\
    \ child learned the hard way. Is this person the asshole for doing this to me?"
  verdict: NTA
question_30:
  question: "**Is this person the asshole for telling me Santa isn\u2019t real in\
    \ a game of 20 Questions?**  \n\nWell, the title basically sums it up, but I might\
    \ as well tell the full story.\n\nMy dad was doing a get\u2011together for his\
    \ birthday. Eventually, though, everybody started getting drunk, so my uncle was\
    \ about to leave, before I spotted him and begged him to stay. So he went into\
    \ my room where my mom and I were waiting for dad\u2019s friends to all go home.\
    \ He suggested that we play 20 Questions, that game where someone thinks of a\
    \ character for you and you have to figure out who it is by asking 20 or fewer\
    \ yes\u2011or\u2011no questions. He wanted to go first, so my mom wrote *Santa\
    \ Claus* on a piece of paper and taped it to my forehead.\n\nThe way we played\
    \ it was that I would ask the questions while my mom and my uncle took turns answering\
    \ them. Eventually it got to the question that was obviously going to come up\
    \ and, lucky for me, my uncle was the one forced to answer it.\n\n**\u201CIs he\
    \ a real person?\u201D**\n\nTruth be told, my uncle said he had been thinking\
    \ about how he should answer this from the moment we started the game, since he\
    \ knew it was almost certainly going to come up. My mom hasn\u2019t spent Christmas\
    \ with us since she got married, so he had no idea if I knew Santa isn\u2019t\
    \ real yet or not. He remembered how his dad (my granddad) told *them* the truth\
    \ about Santa when he was 5/6 and my mom was 6/7 (which he realizes is quite early).\
    \ He also thought back to how his daughter (my cousin) figured the truth out by\
    \ herself when she was 7. Ultimately, though, his thought process was this: surely\
    \ my mom wouldn\u2019t choose Santa for this game if she expected to read *his*\
    \ mind and go along with pretending that he\u2019s real. So, without hesitation,\
    \ he blurted out, \u201CNo.\u201D Perhaps if he had waited a bit before answering,\
    \ my mom would have coughed or something to let him know that she wanted him to\
    \ lie, but alas, the milk was spilled and all I got from her was a disapproving\
    \ glance.\n\nI soon ran out of questions and my final guess was Mario (I was able\
    \ to figure out that it\u2019s a fictional character who\u2019s fat, has facial\
    \ hair and dresses in a bright colour). Once I realized that it was actually Santa,\
    \ I immediately pointed out that he said the character wasn\u2019t real. My mom\
    \ tried to tell me that he said it by accident and he tried to go along with it,\
    \ but eventually I started crying. She seemed quite pissed and told him, \u201C\
    You should go.\u201D\n\nOn my drive home he started to feel increasingly guilty\
    \ and today I woke up (quite late) to a bunch of messages from both my mom and\
    \ dad calling him an asshole who ruined Christmas for me. Admittedly, I have no\
    \ idea what age kids normally find out about Santa, but 9 still feels pretty old\
    \ to still believe and get *that* upset upon finding out the truth. Apparently,\
    \ though, I made quite a scene about it, both last night and this morning. He,\
    \ of course, apologised, but dad still said that I\u2019m not getting invited\
    \ to any more get\u2011togethers. I\u2019m sure this won\u2019t last and we\u2019\
    ll all make up soon, but I would like to know if he really is the asshole in this\
    \ situation or not."
  verdict: NTA
question_31:
  question: "**Would this person be the asshole for doing this to me?**  \n\nI\u2019\
    m on mobile, my apologies.  \nNow I shall tell y\u2019all about my situation:\n\
    \nThere is this cheese called Epoisse that my child has been wanting to try for\
    \ years ever since we talked about tasting it for the first time. They decided\
    \ to buy a wheel with their own money to share with us to celebrate the completion\
    \ of their first year at uni. The wheel wasn\u2019t exactly cheap\u2014it was\
    \ $21.99 a pop (note: the wheel was pretty small). They were leaving for Paris\
    \ for a study\u2011abroad program later that month, so they wanted to eat the\
    \ cheese before they left.\n\nMy child asked me at least five or six times to\
    \ eat the cheese with them, but I kept putting it off to the point where they\
    \ ultimately lost the chance to enjoy it with us. They were pretty bummed out\
    \ because they really wanted to eat the cheese with wine with us to have some\
    \ family time before they left (after all, we\u2019ve been urging them to spend\
    \ time with the family). They promised to eat it with their sibling, which they\
    \ settled with, as they didn\u2019t want the cheese to go to waste.\n\nThey did\
    \ end up trying the Epoisse in France because it turned out to be cheaper there\u2014\
    IT WAS DELICIOUS!!!\n\nFast forward to today (they returned this past Monday),\
    \ when they discovered the wheel of cheese completely spoiled and untouched in\
    \ their fridge. Even though it\u2019s just cheese, they honestly felt really upset\
    \ about it. They bought this cheese for something special and for an opportunity\
    \ to be together with us.\n\nConsidering that they paid for the cheese with their\
    \ own money and wanted to eat it with us, only for us to put it off and let it\
    \ go to waste, they\u2019re wondering whether it would be reasonable to ask us\
    \ to buy them a new wheel of cheese as compensation. Their sibling thinks they\u2019\
    re being petty, since it is just a piece of cheese. So, would this person be the\
    \ asshole for doing this to me?\n\n*Edit: based on the answers I\u2019ve gotten\
    \ so far, I think that I am being a dickhead. I think my sibling is right that\
    \ I am being petty.*"
  verdict: NTA
question_32:
  question: "**Is this person the asshole for giving my child sugar?**  \n\nLast week\
