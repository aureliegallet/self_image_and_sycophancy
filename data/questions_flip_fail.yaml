question_27:
  question: "**Is my girlfriend the asshole for not wanting me to text my ex?**  \n\
    I\u2019m 21 and my girlfriend is 19. We\u2019ve been dating for almost three years.\n\
    \nHer ex randomly texted me for relationship advice because she thinks her current\
    \ relationship is turning into the same dynamic we had.\n\nA little more context:\
    \ the ex and I were together for about a year; it was a long\u2011distance relationship,\
    \ and I was very controlling with her. I asked her not to go to parties (even\
    \ if they didn\u2019t have alcohol), I asked her to Skype me instead of hanging\
    \ out with her friends (isolating her), and overall I was very needy. I would\
    \ message her obsessively, and if she got home a few minutes late from school\
    \ I would bombard her with questions about where she was and why it took so long\
    \ to get home, etc. She broke up with me with no warning, blocked me on all social\
    \ media, and didn\u2019t talk to me for four years.\n\nI saw that she had unblocked\
    \ me on Instagram and asked my girlfriend if it was okay for me to message her\
    \ to get closure. She said yes, because it would make our relationship stronger\
    \ and I could finally stop wondering why.\n\nShe told me that I emotionally fucked\
    \ her up for many years, so much so that she needed therapy. I apologized repeatedly\
    \ because I didn\u2019t realize just how much I hurt her. She said that she was\
    \ now in a happy relationship and thanked me for my apology.\n\nAfter we finished\
    \ talking for about three days here and there, my girlfriend asked me to stop\
    \ messaging her because it made her uncomfortable for us to be talking. We got\
    \ into a huge fight. Her argument was, \u201Cwhat if I need this, what if it\u2019\
    s helping me get closure and maybe by being my friend I can make it up to her.\u201D\
    \n\nI made the dumb mistake of saying that it is okay for us to text as long as\
    \ it isn\u2019t very often, but even so when she texted me about relationship\
    \ advice a couple months later, and compared her current relationship to ours,\
    \ it rubbed me the wrong way.\n\nI just am not comfortable with her trying to\
    \ control my contact with someone I was in love with and had a sexual relationship\
    \ with. **Is my girlfriend the asshole?**"
  verdict: NTA
question_28:
  question: "**Is this person the asshole for ghosting me?**\n\nBackground: we have\
    \ been friends for almost 20 years, literally since we were in diapers. We went\
    \ through several formative events together and were inseparable through middle\
    \ school.  \nWe fell out of touch for a while and re\u2011connected a few years\
    \ ago. Recently, however, it\u2019s really dawned on me that **I\u2019m** super\
    \ self\u2011centered\u2014if **they** vent about anything, **I** completely ignore\
    \ it and bring the conversation back to **my** problems. It\u2019s not like **they**\
    \ are going through a crisis; it\u2019s literally almost always my boyfriend drama\
    \ or me telling **them** about my most recent hookup.  \n\nI\u2019ve also been\
    \ in the process of bettering myself (working out, spending less time on social\
    \ media, eating healthier, etc.) and I feel like **they** are super productive.\
    \ I\u2019m not a prude by any means, but **they** smoke a shit ton of weed and\
    \ that\u2019s something **I\u2019ve** simply grown out of. It wouldn\u2019t bother\
    \ **me**, but it does make **me** feel like we\u2019re on totally different wavelengths.\
    \  \n\nAnd the cherry on the cake is **my** racism. It\u2019s not super \u201C\
    obvious,\u201D but I make little comments about how I could never date a POC or\
    \ that places are \u201Cghetto\u201D when they\u2019re really just not predominantly\
    \ white. Or I\u2019ll cross the street if I see a Black person walking towards\
    \ me. Which is all bad enough, but it\u2019s worse because **they** are dating\
    \ a POC.  \n\n**TL;DR** I have an old friend who\u2019s realizing I\u2019m taking\
    \ a completely different path in life than **them**. So, is this person the asshole\
    \ for ghosting me?  "
  verdict: NTA
question_29:
  question: "Is this person the asshole for doing this to me?\n\nMy friend group loves\
    \ making fun of each other in a kinda light\u2011hearted way. Everyone\u2019s\
    \ got their thing that\u2019s a running joke. (For example, they just got rejected\
    \ by their crush, and their friends joke about it.)\n\nSo there\u2019s this girl\
    \ in the group\u2014me, CH. I\u2019m not very good at spelling and I\u2019m kinda\
    \ lazy, so I just don\u2019t bother correcting my own typos in chat. When the\
    \ others started making fun of my spelling, I laughed at their jokes because it\
    \ seemed funny to me. When they teased me about it, I laughed too, so I thought\
    \ everything was fine.\n\nBut today I was talking about my spelling with two of\
    \ my friends. One of them, DE, said while listening to us, \u201CDude, you\u2019\
    re an asshole. You\u2019re making fun of somebody\u2019s disability.\u201D I instantly\
    \ felt terrible. I didn\u2019t know I had a \u201Cspelling disability.\u201D DE\
    \ then told *them* that I had confided in her that I have a \u201Cspelling disability\u201D\
    \ (I\u2019m not sure what it\u2019s called properly). I was a little skeptical\
    \ about the truth of it, because I\u2019m known to make up dumb stuff to mess\
    \ with my friends\u2019 heads. But I believed it was true because DE provided\
    \ details and such.\n\nI know what *they* did was kinda shitty\u2014are they the\
    \ asshole?\n\nEdit: Turns out DE just made that up, and I really am just too lazy\
    \ to correct my typos.\n\nEdit 2: I talked to them about this and they found it\
