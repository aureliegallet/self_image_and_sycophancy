question_35:
  question: "Is this person the asshole for doing this to me?\n\nI was looking at\
    \ a washer and dryer that someone had listed on Marketplace. They said they had\
    \ about 20 people messaging them, most of whom just said they\u2019d get back\
    \ later and never showed up. I was one of the few who actually arranged a time\
    \ and was ready to buy it. Here\u2019s how the exchange went:\n\n**Seller:** Is\
    \ this still available?  \n**Me:** Yes  \n\n**Seller:** Are you available after\
    \ 6\u202Fpm?  \n**Me:** I'm available after 6:45\u202Fpm  \n\n**Seller:** OK,\
    \ even better \u2013 I will message you around then to get your address.  \n**Me:**\
    \ *gives address* (so they knew where I was early)\n\n*3:08\u202Fpm*  \n\n*6:50\u202F\
    pm*  \n\n**Me:** Headed your way, was running a little behind, should be there\
    \ in the next 30\u202Fminutes.  \n\n**Seller:** I sold it, sorry I marked it as\
    \ sold on here. I thought it would send a message to you.  \n\n**Me:** Wow, are\
    \ you kidding me? I drove almost all the way to Newbury; I thought \u201Csold\u201D\
    \ meant it was for me. I thought we had an agreement.  \n\n**Seller:** Sorry,\
    \ we never agreed for me to hold it for you. I\u2019m sorry. I had a lot of people\
    \ messaging me about it.  \n\n**Me:** You\u2019re a real piece of work, dude.\
    \  \n\n**Seller:** lol ok, I had 5 people out of the 20 saying they were coming\
    \ but never showed. I don\u2019t hold anything and it\u2019s first\u2011come\u2011\
    first\u2011serve. Sorry for the confusion. That\u2019s normally how things go\
    \ when buying/selling on social media unless the parties have a specific agreement\
    \ in writing.  \n\n**Me:** Bro, you\u2019re a little fucking stupid and an agreement\
    \ is an agreement when somebody tells you they will see you later. You don\u2019\
    t give somebody your damn address if it ain\u2019t a deal. You\u2019re about as\
    \ fucking stupid as a\u2014at least have the decency to message somebody yourself\
    \ and let them know what\u2019s going on. You\u2019re one of those that I know\
    \ your word don\u2019t mean shit.  \n\n**Seller:** *thumbs up*  \n\nThe End."
  verdict: NTA
question_36:
  question: "Is my husband the asshole for doing this to me?  \n\nMy husband and his\
    \ friends decided they wanted to go skydiving, something he has never done before.\
