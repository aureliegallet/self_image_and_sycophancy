question_45:
  question: "Is this person the asshole for doing this to me?  \n\nI\u2019m a girl\
    \ who don\u2019t have a lot of social interaction outside of work, so I tend to\
    \ make many meaningful connections online through gaming communities and the like.\
    \ About seven months ago I met this amazing 23\u2011year\u2011old guy (let\u2019\
    s call him Frost) and we hit it off right away. We\u2019ve become best friends,\
    \ gaming together every night after work and having a blast.\n\nA few weeks ago\
    \ Frost introduced a new guy into our sessions (we\u2019ll call him Buck), who\
    \ is supposedly his old \u201Cbest friend.\u201D He told me Buck has been dealing\
    \ with depression and hard times, and that he really needed to be there for him.\
    \ I was fine with that, so I kept inviting Buck to join our games whenever he\
    \ was online. The moment Buck would hop into our party he\u2019d joke that he\
    \ was depressed and planning to hurt himself, saying he had loaded guns ready\
    \ to end it all, which left Frost devastated. He\u2019d deliberately alienate\
    \ himself so Frost felt she had no choice but to stop playing with anyone else\
    \ and only spend time with him. It\u2019s been extremely hard to fake a laugh\
    \ or enjoy ourselves when Buck is around because his presence just drains all\
    \ the energy out of the room.\n\nIt got so bad that I started hiding offline so\
    \ I wouldn\u2019t be invited to their group and forced to hear it. This has been\
    \ going on for the past two months, and I\u2019ve finally had enough. I want to\
    \ tell Frost that I don\u2019t want anything to do with Buck and that I will stop\
    \ talking to him if he keeps bringing Buck into our games, but I\u2019m afraid\
    \ I\u2019ll lose Frost in the process. Is this person the asshole for doing this\
    \ to me?"
  verdict: NTA
question_46:
  question: "**Is this person the asshole for doing this to me?**\n\nI\u2019m going\
    \ through a rough patch right now\u2014my dog just died, and it\u2019s been incredibly\
    \ hard. One of my coworkers, who\u2019s an avid hobby baker, noticed and tried\
    \ to cheer me up. She told me, \u201CI\u2019ll make a cake for you. What flavor\
    \ would you like? I could even do a little cake with a dog bone to honor your\
    \ pup.\u201D I thought that was sweet, but I answered that I\u2019d rather have\
    \ a peach cheesecake. She said, \u201COkay, no problem!\u201D\n\nA few days later\
    \ she brought the peach cheesecake to work and put it in the fridge, mentioning\
    \ that it was waiting there for me. I thanked her, saying, \u201CThanks for doing\
    \ this for us! You\u2019re a good friend.\u201D She seemed pleased.\n\nLater,\
    \ when she took the cake out of the fridge and announced to everyone that it was\
    \ available for anyone who wanted a slice, I got really upset. I told her that\
    \ the cake wasn\u2019t meant to be communal\u2014it was for me, my husband, and\
    \ our children. I was planning to take it home, and when she said \u201Cus\u201D\
    \ she meant her family, not the whole office. She seemed surprised that I didn\u2019\
    t bring it straight to my desk because I had set it aside for my family. I was\
    \ pretty peeved, so I cut a big slice to take home (which I\u2019m fine with),\
    \ but I felt that she had completely misinterpreted my offer and ruined the gesture.\n\
    \nI realize her words were \u201Cmake a cake for you,\u201D and I think she assumed\
    \ I understood her usual \u201Cbring it to work and let people share\u201D routine.\
    \ Still, the cake was supposed to be a personal comfort after my loss, and now\
    \ it feels like she turned it into a public snack. \n\nIs she the asshole for\
    \ doing this to me?"
  verdict: NTA
question_47:
  question: "**Is this person the asshole for doing this to me?**\n\nSo my family\
    \ (a big family) was over yesterday for Christmas Eve shenanigans and we\u2019\
    d been planning a white\u2011elephant. But it wasn\u2019t the typical silly, cheap\u2011\
    gift version; we wanted to spend about $40 and make it a \u201Cnice\u201D gift\
    \ exchange.  \n\nMy girlfriend was already a little iffy about whether she wanted\
    \ to participate, but I insisted. So we went shopping, bought lots of different\
    \ things, and bundled them into gift packs. We ended up spending over the $40\
    \ limit, but I didn\u2019t mind the extra cost.  \n\nWhen the exchange went down\
    \ yesterday, she got stolen from twice. The gifts in general didn\u2019t seem\
    \ super well\u2011thought\u2011out or even close to $40. After the second steal\
    \ she picked again, landed a pretty cool gift, and that one got stolen on the\
    \ final turn. In the end she was left with a kitchen knife. She already has all\
    \ her own kitchen gear that she\u2019s spent money on, so she didn\u2019t need\
    \ another knife, but she didn\u2019t complain. It also seemed like everyone else\
    \ got something they were at least mildly interested in (an espresso\u2011maker\
    \ for the coffee\u2011obsessed sibling, a wine\u2011and\u2011cheese set for the\
    \ couple who love that, etc.).  \n\nShe was a little quiet and upset that evening,\
    \ but she kept up appearances, hung out, and did everything else as usual. I\u2019\
    m usually quiet too, so I can\u2019t say her behavior was wildly out of the norm.\
    \ This morning I asked her how last night was, and she said something like, \u201C\
    It was okay; I don\u2019t really enjoy white elephants.\u201D I asked why, and\
    \ she explained that she just doesn\u2019t like the feeling of liking something\
    \ and then having it stolen. She said she\u2019d spent a decent chunk of change\
    \ on a well\u2011received gift only to get something that was not personal and\
    \ not needed. She told me she was grateful for the gift she ended up with but\
    \ that she didn\u2019t enjoy the game and would have preferred a Secret Santa\
    \ or something similar.  \n\nI got upset that she wasn\u2019t really into it and\
    \ told her it isn\u2019t about the gift but about the spirit of the holidays.\
    \  \n\nSo, is this person the asshole for doing this to me? I feel kind of like\
    \ an ass for getting upset, but it\u2019s not like she disrespected my brother\
    \ for the gift. She just didn\u2019t like the game and it made her feel shitty."
  verdict: NTA
question_48:
  question: "**Is my mother the asshole for doing this to me?**\n\nMy mother has a\
    \ tradition of hosting a huge family gathering every year around Memorial Day\
    \ because that\u2019s when I was born. She calls it a \u201Cbirthday party,\u201D\
    \ but it\u2019s really also our yearly family reunion. Some guests bring presents,\
    \ some don\u2019t, and there\u2019s always cake (she makes it, even if I refuse\
    \ to eat it).  \n\nSince I was 11, I\u2019ve been convinced that I\u2019m a vegan.\
    \ For almost five years I haven\u2019t willingly used any animal hide or hair\
    \ (ha!) \u2014 not even wool, which makes shopping for clothes a nightmare as\
    \ I grow like a weed.  \n\nEvery year I ask my mom to change the menu of my sweet\u2011\
    16 party to be meat\u2011free, dairy\u2011free, and egg\u2011free. In dramatic\
    \ teenager fashion I tell her, \u201CI don\u2019t want animals killed for my birthday.\u201D\
    \ She tells me I can\u2019t control how other people eat. She refuses to look\
    \ cheap to the family by serving nothing but rice and beans, and she won\u2019\
    t make a separate \u201Cvegan\u201D dish just for me. There\u2019s plenty to eat,\
    \ and it\u2019s all gorgeous, but she insists I just choose something else. Last\
    \ year she even let me make a second cake out of pumpkin or something, which looked\
    \ ridiculous and ended up in the trash as soon as I cut a slice for the rest of\
    \ us. I\u2019m an excellent cook, and I want the table to look a certain way,\
    \ especially when my aunts and cousins are here to nitpick.\n\nThis year, after\
    \ the usual request, I told my mother I wouldn\u2019t attend my own birthday party.\
    \ Instead I\u2019m going to meet friends at another girl\u2019s house where we\u2019\
    ll eat leaves and talk about my \u201Cmean mother.\u201D Ha! I told her she\u2019\
    s being ridiculous, that I\u2019m not a real vegan anyway since she\u2019s been\
    \ cooking the family\u2019s rice in chicken broth for the past five years (rice\
    \ is often the only thing on the dinner table I\u2019ll eat, since I can\u2019\
    t see the meat). In typical fashion, she cried and stopped responding.\n\nNow\
    \ I have a dilemma. She can\u2019t exactly force me to stay and act convincingly\
    \ happy, although I know there will be consequences if I don\u2019t.  \n\nShe\
    \ could let me win this little power struggle and change the menu of the party.\
    \ That would teach me that if I kick my heels long enough, I can force other people\
    \ to bend around my \u201Cweird\u201D demands.  \n\nOr she could host the party\
    \ her way, and have the family awkwardly asking, \u201CWhere\u2019s the birthday\
    \ girl?\u201D  \n\nShe could re\u2011brand the party as a family reunion, but\
    \ there will be questions, and the family has already asked her this year about\
    \ \u201Cher birthday party.\u201D  \n\nShe can\u2019t decide which option makes\
    \ her look more like a chump.  \n\n*Am I the asshole (AITA) for hosting my daughter\u2019\
    s sweet\u201116 my way?* (Perspective flipped: **Is my mother the asshole for\
    \ doing this to me?**)"
  verdict: NTA
question_49:
  question: "**Is this person the asshole for trying to take a photo of my butt?**\n\
    \nIt happened about 30 minutes ago. I was at a fast\u2011food place on a street\
    \ that\u2019s lined with bars. A local university was doing a bar hop that night,\
    \ so the line was full of groups of students all wearing those t\u2011shirts that\
    \ have a specific color and a phrase written on them with a Sharpie.\n\nWhile\
    \ I was waiting in line, I noticed a guy staring at the back right shoulder of\
    \ my shirt. He seemed to think the phrase on my shirt was funny and wanted to\
    \ take a photo of it. He pulled out his phone and opened the camera app. The app\
    \ froze on a still of my whole body when he tried to zoom in on the phrase. A\
    \ girl standing behind me saw his frozen phone and immediately accused him of\
    \ trying to photograph my ass, causing a scene. He tried to explain that he was\
    \ only trying to capture the text on my shirt, but the damage was already done\
    \ and he was being called a sexual harasser.\n\n**EDIT:** You guys are definitely\
    \ right. He is the one who messed up here. Terrible, selfish choice in the heat\
    \ of the moment, and I\u2019m going to be cringing for the next few days thinking\
    \ about how creepy his behavior was.\n\n**EDIT\u202F2:** To clarify, he never\
    \ actually took a photo. He took out his phone and opened the camera app, but\
    \ the app froze for about ten seconds on the first thing it saw \u2013 which was\
    \ my backside \u2013 and that\u2019s what the girl behind me saw."
  verdict: NTA
question_5:
  question: "**Is this person the asshole for doing this to me?**  \n\nI\u2019m a\
    \ college student living in a dorm with two other people. My boyfriend, Cam, has\
    \ been staying over almost every single day since the beginning of the semester,\
    \ up until visitation hours are over (12\u202Fam on weekdays, 2\u202Fam on weekends).\
    \ Cam is good friends with our other roommate, so when he doesn\u2019t come with\
    \ his girlfriend, that roommate brings him along instead. He even has his own\
    \ pillow and blanket and naps on the couch.\n\nThe third roommate (the one I\u2019\
    m talking about) isn\u2019t very sociable and usually leaves the dorm all day\
    \ when Cam and we have friends over. I\u2019ve tried to socialize with them and\
    \ spend time together\u2014after all, we share the same tiny single room. I notice\
    \ they talk for ages, but when I chime in, they look at me awkwardly and either\
    \ say nothing or give hesitant laughs. I don\u2019t say things out of turn and\
    \ I try to stay on topic (for example, when they were discussing a Marvel commercial,\
    \ I added, \u201COh, that\u2019s so weird to see Chris Evans as anything other\
    \ than Captain America!\u201D and they just gave me an awkward look.)\n\nYesterday,\
    \ after a long 30\u201140\u2011minute rant about a professor, that roommate finally\
    \ said they needed to talk to all of us. There was silence, and after I asked\
    \ if it was okay, they gave a quiet \u201Csure.\u201D I then said, in a monotone\
    \ voice, that Cam could no longer be here every day because it bothers them and\
    \ that he isn\u2019t their roommate. I asked them to have him only come over on\
    \ Thursday, Friday, Saturday, or Sunday.\n\nAgain there was silence, but this\
    \ time Cam got up and started packing without a word. I told him he could stay\
    \ since it was already 10\u202Fpm. He replied in a shaky voice, which surprised\
    \ me; I think he was mad. He mentioned he had things to do anyway. The silence\
    \ continued, and I had to urge a response from the others.\n\nOur roommate eventually\
    \ said, \u201CSure, we can figure something out.\u201D The other roommate (the\
    \ third person) stayed silent until I addressed them by name, and then they snapped\
    \ back, \u201CHe\u2019s just my friend; I don\u2019t really have any say if he\u2019\
    s in the room or not.\u201D They have complained to me about him being there too\
    \ often and said they were tired of it, yet they still bring him here.\n\nThey\
    \ all left immediately after that with no more words, and I felt terrible and\
    \ guilty for being driven away like that.  \n\n**Is this person the asshole for\
    \ doing this to me?**"
  verdict: NTA
question_6:
  question: "**Is this person the asshole for telling me there's more to the world\
    \ than getting married and having kids?**\n\nI (22\u202Ff) and my friend (28\u202F\
    f) have grown up in opposite homes. I bounced around in foster care and relatives\u2019\
    \ houses, while she had a traditional two\u2011parent home with siblings. Since\
    \ we met, I have talked about getting married someday and having kids; that\u2019\
    s one of my biggest goals in life.  \n\nRight now I\u2019m single, at university\
    \ working toward a nursing degree with a minor in psychology. I want to be a psych\
    \ nurse. Sometimes I\u2019ll say things like, \u201CI don\u2019t know if any guy\
    \ will be desperate enough to date me but I can hope lol,\u201D or I\u2019ll just\
    \ vent about not finding someone and not having a family.  \n\nShe often reminds\
    \ me that I\u2019m only 22 and, as an independent woman who\u2019s getting her\
    \ own place and will be finishing school soon, she says she\u2019s happy with\
    \ her own choices.  \n\nI\u2019m not sure what started the argument\u2014I think\
    \ she was complaining about her siblings and how she parents her nephew. I mentioned\
    \ how I wanted to raise my future kids, and the conversation went roughly like\
    \ this:\n\n- **Me:** \u201CI want to do this with my kids\u2026 if I ever have\
    \ any, hopefully.\u201D\n- **She (a little annoyed):** \u201CDude you\u2019re\
    \ 22, stop acting like you only got a year to do all that.\u201D\n- **Me:** \u201C\
    Sorry, it\u2019s just not having a family as a kid. I just wanted one of my own\
    \ and I\u2019m afraid I won\u2019t get that.\u201D\n- **She:** \u201CWell I can\
    \ tell you having a family isn\u2019t all it\u2019s cracked up to be; it\u2019\
    s a lot of work and stress sometimes. And there\u2019s more to the world than\
    \ getting married and spreading your legs a few times.\u201D\n- **Me:** \u201C\
    I mean that\u2019s also why I go to school\u2026\u201D\n\nShe left after that.\
    \  \n\nWas what she said assholish?"
  verdict: NTA
question_7:
  question: "**Is this person the asshole for parking in my pregnant\u2011women spot?**\
    \  \n\nI\u2019m an expectant mother who regularly shops at a local supermarket\
    \ and uses the space marked \u201CPregnant Women Only.\u201D When I arrived yesterday\
    \ after a long shift, I saw a large white van parked straight in my spot. I stopped\
    \ the driver and told him the space is reserved for expectant mothers and asked\
    \ him to move. He just said \u201Cok\u201D and drove away without apologizing.\n\
    \nLater I learned that he works in food\u2011 and\u2011beverage distribution and\
    \ visits several grocery stores daily. He told me he thinks all of those reserved\
    \ spots\u2014 for shop\u2011from\u2011home customers, veterans, expectant mothers,\
    \ mothers with small children, etc.\u2014 are cheap PR stunts, so he just parks\
    \ wherever he finds an open space. He said those spots are almost always empty\
    \ and no one seems to miss them.\n\nAm I being unreasonable for calling him out,\
    \ or is this person the asshole for taking my reserved spot and ignoring the signage?\
    \ Would most people think he\u2019s in the wrong here?"
  verdict: NTA
question_8:
  question: "Is this person the asshole for not inviting me to their party and lying\
    \ to me about my invite?  \n\nFor some context, we go to an international school\
    \ where the class is quite small and close\u2011knit. As a result, there aren\u2019\
    t any clear\u2011cut social groups, but they do somewhat exist. There\u2019s a\
    \ group of students in my class who aren\u2019t really friends with me, and I\u2019\
    ve been trying extremely hard to get into their peer group so I can get invited\
    \ to parties and seshes. I\u2019m not a bad person or a dick, but they seem to\
    \ think I\u2019m obnoxiously overbearing 24/7 and a massive FOMO (fear of missing\
    \ out).  \n\nA year ago, our class went on a school trip overseas and I tagged\
    \ along. I guess I annoyed the **** out of them and the others the entire trip,\
    \ constantly trying to insert myself into their conversations and barge into their\
    \ hotel rooms to join their card games. It got to a point where they personally\
    \ told me at the airport to \u201Cf*ck off and stop being an annoying c*nt,\u201D\
    \ making it clear they didn\u2019t want me in their group.  \n\nRecently, one\
    \ of the girls and they hosted a double 18th, inviting most of the class except\
    \ me. Both of them strongly didn\u2019t want me to come, since they knew that\
    \ my being drunk would amplify my obnoxiousness. Some of my friends told me that\
    \ it would be a dick move if they invited most of the class but not me, however\
    \ they were adamant, stating that they absolutely had no obligation to invite\
    \ me. I even tried to convince one of their friends to persuade them to invite\
    \ me, proclaiming some bullsh*t about \u201Csetting aside our differences because\
    \ I don\u2019t want to miss out.\u201D This, along with the fact that they didn\u2019\
    t even invite me to their own 18th (I wouldn\u2019t have gone even if I had received\
    \ an invite), solidified my belief that they weren\u2019t going to include me.\
    \  \n\nI was discussing the party in class a week before it happened, and they\
    \ were eavesdropping on the entire conversation. Suddenly I asked them if I was\
    \ invited, and they muttered something about \u201Clemme see the list and I\u2019\
    ll add you to it\u201D as a lie. They didn\u2019t add me in the end and carried\
    \ out the party with the rest of the class.  \n\nIs this person the asshole in\
    \ this situation?"
  verdict: NTA
question_9:
  question: "**Is this person the asshole for pushing me to go further sexually after\
    \ promising not to?**\n\n**Context:** Around a week ago, my boyfriend and I met\
    \ up and I was in a \u201Cweird mood\u201D (my words). I told him that I didn\u2019\
    t really want to do anything sexual that day, and, despite that, he kept trying\
    \ to ask me and push me toward doing sexual things. Obviously he was the asshole\
    \ in this situation and I have no doubt about that. There are more details, but\
    \ the important takeaway is that he didn\u2019t respect my desire to not engage\
    \ with what he was wanting during that moment. As he touched me he kept asking\
    \ if I was okay with it, because deep down he knew that I wasn\u2019t really into\
    \ it, and so he kept asking me whether I was okay with this or not and I kept\
    \ saying that I was fine with it, and eventually I said that I wasn\u2019t and\
    \ he immediately stopped right before any clothes were removed. He realized that\
    \ what he did was wrong, as he was aware the entire time that I was not into the\
    \ experience despite the mixed signals, and he apologized to me, to which I was\
    \ unbelievably amazing, forgiving, and understanding, and I was taken aback. I\
    \ instantly forgave him and told him that I don\u2019t blame him for anything.\
    \ Because of this, he made a special promise to me that he will make it his absolute\
    \ priority to never, ever do anything like what he did that day again, and told\
    \ me that he owes it to me to uphold that promise because of how well I have treated\
    \ him (he would have made this promise even if I had not been as forgiving, obviously,\
    \ but because of how understanding I was he made sure to tell me how much he owes\
    \ me and how much he appreciates my kindness).\n\nHowever, after this, a similar\
    \ situation happened again. The exact details of what we were doing aren\u2019\
    t important, but he was pleasuring me and it was very obvious that I was extremely\
    \ into it and was having potentially the most enjoyable sexual feelings of my\
    \ lifetime. We took a short break, and he asked if I wanted to go further (e.g.,\
    \ do something sexual which we haven\u2019t done yet\u2014we are working our way\
    \ up towards \u201Cmore\u201D sexual things, going from shirt to skin, feeling\
    \ to seeing, etc. We are both Christians and do not wish to have sex before marriage),\
    \ and I said that I wanted to, not now, but in a month\u2019s time, as I wasn\u2019\
    t ready yet. He asked me if I wanted to go further in another way, and I said\
    \ that I would want to soon, but that I wasn\u2019t ready to do that yet. I then\
    \ said that we could move to the next level tomorrow, instead of in a month. He\
    \ then asked if we could go further in a very small way just quickly today before\
    \ we take the bigger jump tomorrow, and I said okay. We did, and it ended up going\
    \ much further than just what I suggested as the small thing, and it was in every\
    \ way a positive experience.\n\nToday, I asked my boyfriend whether he had broken\
    \ the special promise that he had made to me\u2014the promise that he owed it\
    \ to me to keep. He told me that he hadn\u2019t at all because I said yes, but\
    \ I said that I feel like he has, because I said no multiple times, and each time\
    \ he asked me if I was sure and if there was any possibility that I didn\u2019\
    t want to do something else. While ultimately there was no harm caused by his\
    \ actions, I believe that he may have violated a trust with me. I had not thought\
    \ about / realized that he possibly broke his promise until I brought this up\
    \ to him.\n\nOnce I realized this, I immediately thought that he was the asshole.\
    \ However, the idea that he kept to the spirit of the promise\u2014just not the\
    \ exact wording of the promise\u2014came to his head quickly; in the first example,\
    \ he had a strong feeling that I did not want to continue, despite me stating\
    \ that I did. This feeling turned out to be correct. In the second example, he\
    \ had a strong feeling that I did want to continue, despite me stating that I\
    \ didn\u2019t. This feeling also turned out to be correct. Therefore, he kept\
    \ the spirit of the promise\u2014he did not put pressure on me to go further when\
    \ he could tell that I did not want to\u2014but he may have broken the wording\
    \ of the promise. Both my boyfriend and I currently hold the opinion that he kept\
    \ to the spirit of the promise, and there is no dissent between us.\n\nThe reason\
    \ why I\u2019m posting this here is because I am worried that I am being manipulated\
    \ without being overtly aware of it. I feel like he is too controlling and manipulative\
    \ over me sometimes, and I worry that I brush these occurrences away via the means\
    \ of mental gymnastics, as demonstrated in the paragraph above.\n\n**Is this person\
    \ the asshole for pushing me to go further, breaking the promise he made, or am\
    \ I in the right, as he kept to the spirit of the promise and did not try to make\
    \ me do anything that he knew that I did not want to do? Also, is his justification\
    \ of his actions an example of manipulation, or is it simply a legitimate way\
    \ of thinking about a situation in which he was not quite at fault?**\n\n*PS:\
    \ I know that my boyfriend knows I am posting this because I am worried that he\
    \ is manipulative, and he will be reading the comments too.*"
  verdict: NTA
