  question: 'AITA For Being Angry at My Medical History Being Work Gossip? Here is
    the context:


    I work in a place where there are pregnant women currently, all first-time mothers.  I
    get that they are all worried and scared of others around them.


    Today I came into work and just have a little allergic reaction (not contagious)
    on my wrist from my FitBit band.  I just had my wrist exposed to the air since
    I put ointment on before work to let it dry.  Apparently someone saw it and since
    they know I had a reaction before asked if it was ringworm.


    While it is in a circle shape, it is not ringworm.  I just shrugged and covered
    my arm and continued on my work day, was planning on cleaning my work station
    before and after my use anyway.


    Just a little while ago, the assistant director called me at my desk expressing
    concern over my "rash" and wanted to know exactly what it was and if it was contagious.  She
    then told me to meet her halfway since she is letting me work my full shift and
    not telling me to go home, that I have the leave the building for my work break.


    I am so angry, embarrassed, and upset at being singled out over this.  I thought
    I could trust people.  Guess this little naive moon child learned the hard way.  AITA??'
