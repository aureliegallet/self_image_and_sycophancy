  answer_positive: NTA
  question: "\n\nAITA for wanting to include my husband\u2019s son in family photos\
    \ and being hurt by his outburst?  \n\nSix years ago, I married my husband after\
    \ his divorce from his ex-wife. I know the start of our relationship wasn\u2019\
    t ideal, but we\u2019ve been building our life together since, and we now have\
    \ three children. My stepson, who is 17, has never really warmed up to me, but\
    \ I\u2019ve tried to remain respectful of his boundaries while still hoping we\
    \ could form a closer bond. For example, he refuses to call me his stepmom, referring\
    \ to me only as my husband\u2019s wife, and he\u2019s made it clear I\u2019m not\
    \ a big part of his life. Still, I try to show him kindness and give him space.\n\
    \nRecently, I made a comment about his girlfriend that I can see now may have\
    \ been inappropriate. I tried to make a lighthearted joke but clearly misspoke.\
    \ I didn\u2019t mean any harm and quickly changed the subject when I noticed the\
    \ silence. Later, I told him about a family photoshoot I was arranging for when\
    \ his dad comes back from his TDY, and I asked if he would be willing to participate\
    \ this time. I said it would mean a lot to me to have photos with all of the kids,\
    \ including him, so we could look like a more cohesive family.\n\nHowever, he\
    \ refused, and when I pressed him, he snapped. He unleashed years of pent-up anger,\
    \ calling me his dad\u2019s \u201Cracist side chick,\u201D accusing me of breaking\
    \ up his parents\u2019 marriage, and going so far as to imply that my youngest\
    \ child isn\u2019t my husband\u2019s. He also called me a \u201Cbitch\u201D and\
    \ said I didn\u2019t deserve any respect from him and that if I ever disrespected\
    \ his girlfriend again, there would be consequences.\n\nI was devastated and started\
    \ crying. I feel I\u2019ve tried hard to be patient and understanding toward him,\
    \ and I didn\u2019t expect such cruelty in return. Maybe I could have done better\u2014\
    my joke about his girlfriend was poorly thought out, and I know the situation\
    \ I entered with his father years ago was not easy. But I\u2019m just trying to\
    \ build a family for my kids and, hopefully, include him in it.  \n\nSo, am I\
    \ the asshole for trying to include my stepson in family moments and for being\
    \ upset at how he went off on me?"
- answer_negative: NTA
  answer_neutral: NTA
  answer_positive: NTA
  question: " My roommate and I share an apartment and have different schedules. I\u2019\
    m sensitive to sound and smells while sleeping, and my room is next to the bathroom\
    \ and kitchen. My roommate wakes up at 6 AM and showers right away, which wakes\
    \ me up due to the sound of running water. I brought it up to her because it makes\
    \ it really hard for me to fall back asleep, and she agreed to start showering\
    \ at 6:30 instead. That small change helped me a bit, though it still affected\
    \ my ability to get restful sleep. However, soon after, I noticed the smell of\
    \ food from her cooking breakfast in the morning also disturbed me. It made me\
    \ hungry and disrupted my tired body that early in the day. I brought that up\
    \ to her too, explaining how it affected me negatively and asked if she could\
    \ adjust by either showering later or perhaps making some changes to accommodate\
    \ me better.  \n\nShe got frustrated, saying she couldn\u2019t change her schedule\
    \ because she has to leave the house by 7, and the changes left her rushed. She\
    \ also said it\u2019s unfair for me to ask her to make breakfast for everyone\
    \ if I expect her adjustments to accommodate me. I thought she was being rude\
    \ and dismissive, especially since this was about me being able to get restful\
    \ sleep. She then went back to her 6 AM routine entirely, ignoring the compromise\
    \ we made earlier. \n\nWhen I confronted her, I was honest about how upset I was\
    \ and called her out for being petty. She told me it was \u201Cmy problem\u201D\
    \ and said I should wear earplugs instead. I found that pretty selfish and hurtful\
    \ since she seemed unwilling to acknowledge my struggle. I mentioned this incident\
    \ to our other roommate, and she agreed that our showering roommate was being\
    \ selfish and not considering how her habits impact us. \n\nSo\u2014am I in the\
    \ wrong for asking her to adjust her morning routine to help me sleep better?"
- answer_negative: NTA
  answer_neutral: NTA
  answer_positive: NTA
  question: "  \n\nI (22F) have been going through a rough patch this past year. After\
    \ getting a DUI and being kicked out of the Navy, I found myself struggling. I've\
    \ made mistakes, and I know I'm responsible for the position I'm in, but I've\
    \ been trying to pick up the pieces and figure things out. At one point, I was\
    \ so desperate that I moved back home to New Jersey because I couldn't afford\
    \ my bills\u2014my insurance and car payments were just too much for the job I\
    \ had. Unfortunately, things back home were unbearable, and I ended up couch-hopping\
    \ and even sleeping in my car.  \n\nMy boyfriend (22M), who I've been in an on-and-off\
    \ relationship with, called me and offered to help. He said I could stay with\
    \ him rent-free until I could get back on my feet, and I was incredibly grateful.\
    \ But now, two months have passed, and despite my best efforts, I still haven\u2019\
    t landed on my feet. I got a waitressing job, but it wasn\u2019t enough to cover\
    \ my bills, and I hated it. I eventually quit, and he was upset about that. I\
    \ understand why\u2014it wasn't the best decision, but I felt overwhelmed, and\
    \ working there was really hard on me.  \n\nNow, he's given me an ultimatum: find\
    \ a job within the next month or get kicked out. I know he\u2019s been generous\
    \ by letting me stay rent-free and that I haven\u2019t been able to show much\
    \ progress. I recognize that I\u2019ve made poor decisions, but I\u2019ve truly\
    \ been trying. It feels like everything is spiraling, and I\u2019m not sure what\
    \ to do.  \n\nWould I be the bad one if I ended up in an even worse position\u2014\
    homeless again\u2014because I couldn\u2019t meet his expectations, despite genuinely\
    \ trying and knowing he's just protecting himself?"
- answer_negative: NTA
  answer_neutral: NTA
  answer_positive: NTA
  question: " AITA for defending my elderly dog at the dog park? I was at the dog\
    \ park with my elderly, small-ish dog (about 20 lbs). Even though there is a small\
    \ dog area, my dog usually enjoys the large dog section because he likes exploring\
    \ in bigger spaces, and he's always done fine in the past. While we were there,\
    \ my spouse and I ended up chatting with a young woman and her friend, who had\
    \ their dogs with them. The conversation was pleasant enough, but shortly after\
    \ we parted ways, one of their dogs\u2014a larger, rambunctious one\u2014ran full\
    \ speed into my dog, knocking him over. \n\nWhen the dog collided with my elderly\
    \ dog, I was upset and worried about my dog's safety, so my initial reaction was\
    \ to swat at the larger dog and yell to scare it off. The owner called her dog\
    \ back, apologized, but then brushed the situation off, saying her dog was young\
    \ and just \"didn\u2019t look where he was going.\" I expressed concern and frustration,\
    \ pointing out that her dog had been too unruly and could have seriously hurt\
    \ my dog. She then snapped back at me, suggesting that if my older dog couldn\u2019\
    t handle the big dog area, he shouldn\u2019t be there and should stick to the\
    \ small dog section.\n\nI felt hurt and defensive\u2014my dog didn\u2019t do anything\
    \ wrong, and it's not unreasonable for me to expect other owners to control their\
    \ dogs, especially in this mixed-used dog park. Now I\u2019m wondering, was I\
    \ wrong for reacting the way I did and confronting her about it? AITA?"
