  question: 'AITA - For not wanting a 3rd kid? My wife and I have been dating for
    10 years married for 5 and we have 2 kids. Since even before we had our first
    one I always told her I want 2 kids and not more than that while she wanted 2-3.
    After our second was a few month''s old we talked about contraceptives and what
    next steps to take. I told her I''d like to have a vasectomy but she suggested
    she takes a copper IUD and go for vasectomy after. I reluctantly agreed mostly
    because the IUD seemed safe.


    &#x200B;


    A year passes and one night she shows me a positive pregnancy test. I tell her
    how that is possible and her response is that we must have been very unlucky.
    I ask her if she''s lost the IUD and she tells me it can''t be and it must have
    moved up inside. A few days pass while we wait for the gynecologist appointment
    all while we mostly avoid each other because I got suspicious that she''s trying
    to trick me. For this part I definitely am an asshole because it turns out the
    IUD was still inside her and I apologized for that.


    &#x200B;


    Problem is now what to do with the kid. I told her that we agreed on having 2
    kids and that while she was watching our 2 kids and I was the only working part
    that our savings where hurting a little bit each year. Still enough for 3-4 months
    rent but if it would go on another 4-5 years we would definitely be in a tough
    spot. Also I was done with having kids... I was perfectly happy with 2 and just
    didn''t want more. Risking our integrity and forcing our 2 kids to share what
    we have with another sibling seemed unfair to me.


    &#x200B;


    Now before I go on with the next part I''d like to tell you a little bit about
    us. We''ve been boyfriend and girlfriend since we were 15 years old. Both never
    had a partner before and we agreed with one another with every major decision
    ever since. We almost never had any really bad fights so this turned out to be
    our biggest one ever.


    &#x200B;


    Nothing that I said seemed to be able to sway her. No logical argument worked.
    It was like talking to a different person. She said that having an abortion is
    a horrible experience and that she doesn''t want to go through that and that it
    was her body and her decision to make. Bam.. just like that I''m demoted to a
    joke... can''t leave her because I want to keep my 2 kids - don''t want to stay
    with a person that decided I don''t have a saying in this at all. Fast forward
    a month and I calculated all possible outcomes for this and the only really noteworthy
    thing to mention is that the kids would loose the most no matter what and I did
    not want that.


    &#x200B;


    The number of people of friends family and co. in support of her not going through
    an abortion outnumber my support for not forcing me to raise a third kid I don''t
    want and risk my family''s integrity by 10:1. All this happened about a year ago.


    &#x200B;


    Now I turn to Reddit.. AITA?


    &#x200B;


    TL;DR


    Wife gets prego 3rd time. I don''t want 3 kids - happy with 2. AITA?'
- answer_negative: NTA
  answer_neutral: NTA
  answer_positive: NTA
  question: "AITA For cutting off friendship after 1 drunk night ? This happened a\
