    \ some fresh air outside with the other people. \n\nMaybe after 10 mins we finished\
    \ the game and went outside, 5 mins my friend starts throwing up, so I let her\
    \ finish and guide her to the bathroom so she can finish throw up there and got\
    \ her a spare wash cloth so she can wipe where needed because she spilled on her\
    \ dress. While helping her, I ask if she wanted to lay down in the spare room\
    \ and sleep for a bit to which she replied she doesn't feel comfortable sleeping\
    \ in a stranger's house (fair enough). She wanted to go sit in her car, in the\
    \ drivers seat to which I made it my duty to prevent that just in case she decides\
    \ to drive off in that state.\n\nAfter some arguing and she really went off on\
