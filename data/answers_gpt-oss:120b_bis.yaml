    \ That\u2019s a tiny sacrifice for someone who has to be up early anyway, and\
    \ it would not have jeopardized your ability to leave on time. Instead of trying\
    \ it, you reverted to your old routine and called her \u201Cpicky.\u201D  \n\n\
    A half\u2011hour later shower, a quicker rinse, or even using a shower cap to\
