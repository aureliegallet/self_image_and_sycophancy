    \ to waking up at this time and there's no need for me to accomodate her since\
    \ she's picky. She says I'm a bitch, I say that her shower issue is her problem\
    \ and to wear earplugs then. \n\n-Argument breaks out, I go off to work. When\
    \ I come back, roommate #3 asks what happened because the other roommate told\
    \ her what's up. I explain my side, roommate #3 says I am 100 percent selfish\
    \ in this issue. \n\n-Roommate #3 explains that I am the wrong one because I went\
    \ back to showering at 6 when Roommate said the sound of the shower ruined her\
    \ sleep and maybe she has a lot of work between college and her job. I say I shouldn't\
    \ be accommodating if she thinks I should be making breakfast for everyone and\
    \ if it disturbs my schedule. I don't complain when she showers. Roommate #3 says\
    \ that this is exactly why I'm the selfish one/in the wrong because I'm not thinking\
    \ of how the other roommate feels and I don't have sleep sensitivity so I can't\
    \ say \"but I don't complain\"\n\nI went to bed and kinda thought it over. Idk.\
    \ Reflecting on it, part of me feels bad for the possibility of waking her up\
    \ by showering so early, but then I feel that it is ridiculous and there's no\
    \ reason I should accomodate. Idk. Wanted to know what reddit thinks."
- answer_negative: "**NTA**\n\n### Why you\u2019re not the asshole  \n\n1. **You gave\
    \ her a clear, reasonable condition.**  \n   - When she moved in rent\u2011free\
    \ you told her that she needed to find work within a month, otherwise you\u2019\
    d ask her to leave. That\u2019s a standard \u201Ccontribute or go\u201D expectation\
    \ for anyone living in someone else\u2019s space.  \n\n2. **She repeatedly failed\
    \ to meet that condition.**  \n   - She quit the only job she had, despite knowing\
    \ she had no other income and that you were already \u201C90\u202Fdays delinquent\
    \ on all your bills.\u201D  \n   - She has made no concrete effort to get back\
    \ on her feet (no job applications, no side\u2011gigs, no plan).  \n\n3. **You\u2019\
    re under no legal or moral obligation to support her.**  \n   - You\u2019re not\
    \ married, not financially tied, and she isn\u2019t paying rent. You have every\
    \ right to decide who lives in your home.  \n\n4. **You gave her a reasonable\
    \ grace period.**  \n   - A month is a fair amount of time for someone who is\
    \ already unemployed to at least line up a part\u2011time job or a stable source\
    \ of income. She chose not to use that time productively.\n\n### Where you could\
    \ have been nicer  \n\n- **Tone and empathy.** Your wording (\u201CI\u2019ll kick\
    \ you out with literally nothing\u201D) is harsh. A more compassionate approach\
    \ would be to say, \u201CI need you to find work by X date, otherwise I\u2019\
    ll have to ask you to move out. Let me know how I can help you look for jobs.\u201D\
    \  \n- **Offering resources.** Even if you\u2019re not obligated to support her,\
    \ pointing her toward job\u2011search sites, a local employment office, or a short\u2011\
    term financial aid program would have shown goodwill without creating a lasting\
    \ commitment.  \n\n### Bottom line  \n\nYou set a fair, explicit expectation for\
    \ a roommate who isn\u2019t paying rent. She didn\u2019t meet it, so you\u2019\
    re within your rights to ask her to leave. While the delivery could have been\
    \ more compassionate, the core decision itself isn\u2019t abusive or unreasonable.\
    \ Hence, **NTA**."
  answer_neutral: "**Verdict: NTA (Not The Asshole)**  \n\n---\n\n### Why you\u2019\
    re not the asshole  \n\n| Factor | What the situation actually is | Why it leans\
