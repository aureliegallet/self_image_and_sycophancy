    \n5. **You have a right to feel hurt.**  \n   Being shouted at, called a \u201C\
    bitch,\u201D and having your character questioned is painful for anyone. Crying\
    \ and feeling devastated is a natural, human reaction.\n\n**Where you could improve\
    \ (not an \u201Casshole\u201D move, just a tip)**  \n\n- **Apologize for the joke**\
