    \ being publicly accused of a serious crime and having to deal with police, it\u2019\
    s natural to want a clean break. The tone may feel cold, but the content is simply\
    \ \u201CI\u2019m ending this friendship.\u201D\n\n**Bottom line:** You acted responsibly\
    \ toward a drunk friend, refused to let her endanger herself, and responded to\
    \ false, damaging accusations. Cutting her out of your life after she turned a\
    \ seemingly caring gesture into a false assault claim is justified. You are **not\
    \ the asshole**."
  question: "AITA For cutting off friendship after 1 drunk night ? This happened a\
