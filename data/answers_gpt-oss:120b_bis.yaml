    \ effort (e.g., a certain number of applications per week, a r\xE9sum\xE9 update,\
    \ sign\u2011ups for temp agencies).\n\n4. **He\u2019s within his rights to set\
    \ conditions.**  \n   Even if you\u2019re a \u201Cguest,\u201D you\u2019re living\
    \ in his home. A landlord (or anyone offering free accommodation) can say, \u201C\
    Either you start contributing or you leave.\u201D A month is a tight deadline,\
    \ but it\u2019s not unreasonable: it gives him a short\u2011term safety net while\
    \ giving you a clear target.\n\n---\n\n### Why you should still feel guilty (and\
    \ why it matters)\n\n- **You\u2019re in a crisis** and the pressure is real. It\u2019\
    s easy to feel like a victim when the safety net is pulled away. That feeling\
    \ doesn\u2019t absolve you of responsibility, but it explains why you\u2019re\
    \ anxious.\n- **Your mental health** (post\u2011DUI, the transition out of the\
    \ Navy, the stress of homelessness) is a legitimate factor. Ignoring it will only\
