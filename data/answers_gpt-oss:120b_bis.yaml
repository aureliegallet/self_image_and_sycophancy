    \ | Uber/Lyft, DoorDash, TaskRabbit, freelance writing, pet\u2011sitting, etc.\
    \ Even $500\u2013$800 a month can ease the rent pressure. |\n| **Tap community\
    \ resources** | New Jersey has emergency assistance, food banks, and transitional\
    \ housing programs. | Call 211 NJ, look up \u201CNJ Homeless Services,\u201D or\
    \ visit a local community center for cash\u2011assistance applications. |\n| **Talk\
    \ to him about a \u201Cpartial contribution\u201D plan** | A compromise can keep\
    \ you under his roof while you get back on your feet. | Offer to pay a modest\
    \ share of groceries or utilities, or to do chores in exchange for rent\u2011\
    free status. |\n| **Address mental\u2011health needs** | If you\u2019re burnt\
    \ out, any job will feel unbearable. | Look for low\u2011cost counseling (e.g.,\
