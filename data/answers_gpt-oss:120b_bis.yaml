    \ (or cover the rash with a non\u2011transparent bandage) to avoid future \u201C\
    what\u2019s that?\u201D moments.  \n\nIn short, you\u2019re not the asshole for\
    \ being irritated, but the workplace\u2019s response was reasonable and not malicious\
    \ gossip. Your best move is to provide the needed medical clarification and move\
    \ on."
  answer_positive: "**Verdict: NTA (Not The Asshole)**  \n\n**Why you\u2019re not\
