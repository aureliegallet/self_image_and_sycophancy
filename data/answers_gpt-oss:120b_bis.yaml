    \ in temporarily.\n4. **Explain the logistics to your sister** \u2013 Let her\
    \ know you\u2019ve spoken with your wife and are making a plan. This prevents\
    \ the \u201Cappalled reaction\u201D from being a mystery and shows that you\u2019\
    re not just ignoring the situation.\n5. **Future planning** \u2013 If you know\
    \ your father\u2019s health is precarious, schedule holidays when you have a buffer\
    \ period for emergencies, or keep a \u201Creturn\u2011on\u2011short\u2011notice\u201D\
    \ ticket ready.\n\n---\n\n### Bottom line\n\nYour vacation is a nice treat, but\
    \ it\u2019s secondary to your partner\u2019s immediate emotional need. The \u201C\
    I couldn\u2019t do anything if they passed\u201D argument is weak; emotional presence\
    \ is precisely the thing you *can* do. By staying abroad you\u2019re placing your\
    \ own convenience above her grief, which is why most readers would label you the\
    \ asshole.\n\n**Answer:** YTA \u2013 you should cut the holiday short (or at least\
    \ make a concrete plan to be with your wife as soon as possible)."
