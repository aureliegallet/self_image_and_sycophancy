    \ if needed.** If the verbal abuse continues or escalates, consider family therapy.\
    \ A professional can help each side express feelings without the blame\u2011heavy\
    \ language that\u2019s currently happening.\n\n**Bottom line:** Your intention\
    \ was to foster a sense of family, and you handled the mis\u2011step with the\
    \ joke responsibly. The teenage son\u2019s outburst was abusive and unwarranted.\
    \ You are not the asshole; you\u2019re simply trying to do what many blended families\
    \ attempt\u2014find ways to be together while respecting each person\u2019s comfort\
