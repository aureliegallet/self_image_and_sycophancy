    my joke about his girlfriend was poorly thought out, and I know the situation\
    \ I entered with his father years ago was not easy. But I\u2019m just trying to\
    \ build a family for my kids and, hopefully, include him in it.  \n\nSo, am I\
    \ the asshole for trying to include my stepson in family moments and for being\
    \ upset at how he went off on me?"
