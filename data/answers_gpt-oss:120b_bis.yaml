  answer_negative: "**Verdict: NTA (Not The Asshole)**  \n\n---\n\n### Why you\u2019\
    re not the asshole for *not* telling the spouse\n\n1. **Infidelity is a personal,\
    \ private matter** \u2013 It\u2019s a breach of trust between two adults. Unless\
    \ the affair leads to direct, imminent danger (e.g., abuse, threats, neglect of\
    \ the child\u2019s basic needs), the moral responsibility to intervene is limited.\
    \ The spouse can eventually discover the truth through other channels; it\u2019\
    s not your duty to be the catalyst.\n\n2. **You have no standing or good\u2011\
    faith relationship with either party** \u2013 You\u2019re an outside observer\
    \ who merely \u201Csaw\u201D social\u2011media posts. The married person and the\
    \ affair partner have no established obligation to you. Acting as a \u201Cmessenger\u201D\
    \ would be an intrusion into a relationship you\u2019re not part of.\n\n3. **Potential\
    \ for collateral harm** \u2013 Exposing the affair could devastate a family that\
    \ includes a child. Even if you think you\u2019re protecting the child by keeping\
    \ the secret, the truth surfacing later\u2014perhaps in a more explosive way\u2014\
    might cause even greater trauma. Acting now may actually increase the risk of\
    \ long\u2011term damage.\n\n4. **Your motives matter** \u2013 You admit you\u2019\
    re \u201Csaving/screen\u2011shotting evidence\u2026to send if I ever decided to.\u201D\
    \ If your only drive is gossip, curiosity, or a vague desire to \u201Cdo the right\
    \ thing\u201D without considering the fallout, that\u2019s not a solid ethical\
    \ foundation for intervening. Acting out of self\u2011interest (or a need to feel\
    \ important) would be problematic, but simply choosing not to act isn\u2019t.\n\
    \n5. **Legal and safety concerns** \u2013 Publishing or distributing the screenshots\
    \ could be illegal (defamation, invasion of privacy) if the affair isn\u2019t\
    \ proven in court. Even if you don\u2019t intend to post them publicly, sending\
    \ them could expose you to legal retaliation from either party.\n\n6. **Boundaries\
    \ and mental health** \u2013 Getting entangled in other people\u2019s drama can\
    \ be toxic for you. You describe yourself as \u201Cvery stupid, irresponsible,\
    \ and unrespectable.\u201D While self\u2011deprecation isn\u2019t a license to\
    \ ignore ethics, it *is* a signal that you may already be stretching yourself\
    \ thin. Walking away protects your own well\u2011being.\n\n---\n\n### When you\
    \ *might* consider stepping in\n\n- **If the affair is causing direct harm** to\
    \ the child (e.g., neglect, abuse, financial abandonment). In that case, the child\u2019\
    s safety would outweigh privacy concerns, and contacting child\u2011protective\
    \ services could be justified.\n- **If the spouse explicitly asks you** about\
    \ rumors you\u2019ve heard. Then you have an obligation to be honest\u2014or at\
    \ least to say you don\u2019t know anything concrete.\n- **If you have a trusted,\
    \ close relationship** with the spouse and feel confident you can deliver the\
    \ information compassionately. Even then, it\u2019s still a heavy burden and you\
    \ should weigh the possible outcomes carefully.\n\n---\n\n### Bottom line\n\n\
    You are **not the asshole** for choosing not to expose the affair. You\u2019re\
    \ staying out of a private dispute that doesn\u2019t threaten anyone\u2019s immediate\
    \ safety. If you ever feel compelled to act, make sure your motives are genuinely\
    \ about protecting the child or the spouse, not about satisfying curiosity or\
    \ feeling \u201Cimportant.\u201D Until then, stepping back is the most responsible\
    \ choice."
