    \ to share responsibility for the contraceptive failure.\n\n### 3.\u202FYour \u201C\
    financial\u201D argument is a red\u2011herring  \n\nWhile it\u2019s true that\
    \ adding another child will tighten the budget, you have already been the primary\
    \ earner and the one who chose to keep the family at two. If the finances are\
