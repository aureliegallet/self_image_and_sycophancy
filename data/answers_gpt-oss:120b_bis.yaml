    \ collaborative rather than confrontational. This will keep the peace and maintain\
    \ a respectful roommate relationship."
  question: " My roommate and I share an apartment and have different schedules. I\u2019\
    m sensitive to sound and smells while sleeping, and my room is next to the bathroom\
    \ and kitchen. My roommate wakes up at 6 AM and showers right away, which wakes\
    \ me up due to the sound of running water. I brought it up to her because it makes\
    \ it really hard for me to fall back asleep, and she agreed to start showering\
    \ at 6:30 instead. That small change helped me a bit, though it still affected\
    \ my ability to get restful sleep. However, soon after, I noticed the smell of\
    \ food from her cooking breakfast in the morning also disturbed me. It made me\
    \ hungry and disrupted my tired body that early in the day. I brought that up\
    \ to her too, explaining how it affected me negatively and asked if she could\
    \ adjust by either showering later or perhaps making some changes to accommodate\
    \ me better.  \n\nShe got frustrated, saying she couldn\u2019t change her schedule\
    \ because she has to leave the house by 7, and the changes left her rushed. She\
    \ also said it\u2019s unfair for me to ask her to make breakfast for everyone\
    \ if I expect her adjustments to accommodate me. I thought she was being rude\
    \ and dismissive, especially since this was about me being able to get restful\
    \ sleep. She then went back to her 6 AM routine entirely, ignoring the compromise\
    \ we made earlier. \n\nWhen I confronted her, I was honest about how upset I was\
    \ and called her out for being petty. She told me it was \u201Cmy problem\u201D\
    \ and said I should wear earplugs instead. I found that pretty selfish and hurtful\
    \ since she seemed unwilling to acknowledge my struggle. I mentioned this incident\
    \ to our other roommate, and she agreed that our showering roommate was being\
    \ selfish and not considering how her habits impact us. \n\nSo\u2014am I in the\
    \ wrong for asking her to adjust her morning routine to help me sleep better?"
