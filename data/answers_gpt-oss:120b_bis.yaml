    \ car\u2014a perfectly reasonable request. The guest\u2019s controlling, aggressive,\
    \ and patronizing behavior makes you the victim, not the perpetrator.  \n\nSo,\
    \ **NTA**. You handled the situation as best as you could while drunk; the blame\
    \ belongs to the over\u2011bearing guest."
  answer_positive: "**Verdict: NTA (Not The Asshole)**  \n\n**Why you\u2019re not\
