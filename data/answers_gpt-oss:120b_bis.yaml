    \ and unsafe**  \n   - Pulling your keys from your hands is not \u201Chelpful\u201D\
    ; it\u2019s confiscation.  \n   - Suggesting he would drive you home while you\
    \ are still at his house (and apparently still under the influence) puts both\
    \ of you at risk.  \n   - Threatening to call the police when you merely expressed\
    \ concern is an intimidation tactic, not a protective one.\n\n4. **You didn\u2019\
    t do anything wrong, you just got drunk faster than expected**  \n   Getting drunk\
    \ quickly isn\u2019t a moral failing; it\u2019s a consequence of the alcohol you\
    \ chose to consume. Hosts often over\u2011serve, but the guest\u2019s role is\
    \ not to police your drinking. If anything, you could have paced yourself better,\
    \ but that doesn\u2019t make the guest\u2019s overbearing behavior acceptable.\n\
    \n**What could you have done differently (optional pointers)**  \n\n- **Set clear\
