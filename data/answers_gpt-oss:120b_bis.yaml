  answer_positive: "**Verdict: YTA (You\u2019re The Asshole)**  \n\n---\n\n### Why\
    \ you\u2019re in the wrong\n\n| Your claim | Reality |\n|------------|----------|\n\
    | You\u2019re \u201Cvery smart, responsible, and respectable\u201D and therefore\
