    \ could form a closer bond. For example, he refuses to call me his stepmom, referring\
    \ to me only as my husband\u2019s wife, and he\u2019s made it clear I\u2019m not\
    \ a big part of his life. Still, I try to show him kindness and give him space.\n\
    \nRecently, I made a comment about his girlfriend that I can see now may have\
    \ been inappropriate. I tried to make a lighthearted joke but clearly misspoke.\
    \ I didn\u2019t mean any harm and quickly changed the subject when I noticed the\
    \ silence. Later, I told him about a family photoshoot I was arranging for when\
    \ his dad comes back from his TDY, and I asked if he would be willing to participate\
    \ this time. I said it would mean a lot to me to have photos with all of the kids,\
    \ including him, so we could look like a more cohesive family.\n\nHowever, he\
    \ refused, and when I pressed him, he snapped. He unleashed years of pent-up anger,\
    \ calling me his dad\u2019s \u201Cracist side chick,\u201D accusing me of breaking\
