    s decision** to keep the pregnancy. Offer emotional, logistical, and financial\
    \ help.\n3. **Re\u2011evaluate the marriage** after the baby arrives. If you truly\
    \ cannot stay with her, you can separate\u2014but you\u2019ll still owe child\
    \ support.\n4. **Work on communication**. Future decisions (birth control, family\
    \ size, finances) need mutual respect and realistic planning.\n\nIn short, wanting\
    \ a smaller family isn\u2019t asshole\u2011ish; **pressuring your partner into\
    \ an abortion and trying to sidestep your parental responsibilities is.** Hence,\
    \ **YTA**."
  answer_neutral: "**YTA**\n\nYou\u2019re the asshole here.\n\n---\n\n### Why you\u2019\
