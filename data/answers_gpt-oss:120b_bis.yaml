  question: "AITA for going through my brothers phone to try and find out what is\
    \ wrong with him My brother (16) has not gone to school for two weeks and has\
    \ missed 8 days in the 3 last weeks of the term before this term. I have recently\
    \ learned that his grades are not as good as I thought, his highest grade is one\
    \ 4, lowest is a U, and everything in between. (We are in the UK. 4 = C, U i think\
    \ means ungraded/not attempted.)\n\nMy mum and I have tried every way we could\
    \ possibly think of to help him, or to understand why he is struggling with going\
    \ to school and why his grades are so low. He gives us nothing back, his answers\
    \ to every question is \u201CI dont know\u201D or some other sarcastic remark.\
    \ My mum is extremely soft with him because in the past, maybe 2 years ago he\
    \ was depressed. Not clinically diagnosed, but he was hurting himself for a brief\
    \ period of time. He didn\u2019t respond to therapy. Then he all of a sudden he\
    \ was as happy as can be, friends over all the time, confidence overflowing. Since\
    \ then he gets away with EVERYTHING, with maybe a \u201Cstern\u201D talking to,\
    \ if anything, because my mum doesn\u2019t want to be the reason he goes back\
    \ to where he was. She was NEVER that soft with me (22F) but thats another topic\
    \ for another day.\n\nSo since we tried talking to him, we tried asking him if\
    \ there was ANY possible way we could help, we tried going to the doctors, we\
    \ tried seeking help from his school teachers, we came  up with a week-by-week\
    \ revision schedule with all three of us working together to improve his grades\
    \ - he isn\u2019t interested. nothing is helping the situation. \n\nI know that\
    \ if my brother misses any more school, my mum will be fined or even sent to prison\
    \ for failing to get him to school. He knows this too.\n\nSo AITA for snatching\
    \ my brothers phone whilst he was on it and locking myself in my bedroom in order\
    \ to try and get some information - maybe from his friends or his pictures or\
    \ SOMETHING - to try and figure out what is bothering him so much that he\u2019\
    s too depressed to go to school? His reaction was obviously very negative. Our\
    \ relationship may never be the same again. But i felt like i had no other choice.\
    \ My mum and I wanted to help - we NEEDED to help, i felt like i had no choice\
    \ but to do the thing that could very well break our relationship\n\nbut how am\
    \ i meant to just let my brother fight his demons by himself. and what if he loses\n\
    \nTLDR: i took my 16yo brothers phone to try and find out what is making him depressed\
    \ in attempt to help him as a last resort"
- answer_negative: "**YTA**\n\nYou are in possession of concrete evidence that a married\
    \ person is cheating on their spouse and that there\u2019s a child involved. Keeping\
    \ that information to yourself isn\u2019t \u201Cjust staying out of other people\u2019\
    s business\u201D \u2013 it\u2019s actively denying the spouse the agency to make\
    \ an informed decision about a relationship that directly affects their life,\
    \ emotional well\u2011being, and the well\u2011being of their child.\n\n**Why\
    \ it\u2019s the wrong move to stay silent**\n\n1. **The spouse\u2019s right to\
    \ know** \u2013 Infidelity is a betrayal that changes the fundamental terms of\
    \ a marriage. The cheated\u2011on partner deserves to know the truth, even if\
    \ it\u2019s painful. Withholding it is a betrayal of the spouse\u2019s trust in\
    \ you (or at least in the honesty of the information you could share).\n\n2. **Potential\
    \ harm to the child** \u2013 You claim you\u2019re trying to protect the child,\
    \ but the child will be harmed more by growing up in a household built on deception.\
    \ If the cheating continues, the child may later discover the lie, which can cause\
    \ deeper trust issues and emotional trauma than the fallout of a divorce.\n\n\
    3. **Enabling the cheater** \u2013 By not speaking up, you\u2019re effectively\
    \ enabling the cheater\u2019s behavior. They continue to act without consequence,\
    \ possibly deepening the betrayal and making it harder for everyone involved to\
    \ move forward.\n\n4. **Your evidence is solid** \u2013 You have screenshots and\
    \ a timeline, not just gossip. This isn\u2019t a \u201Chears\u2011ay\u201D situation\
    \ where you risk spreading a rumor; you have proof. That makes the moral imperative\
    \ stronger.\n\n5. **No personal gain** \u2013 You admit you have \u201Cnothing\
    \ to lose.\u201D If you have no ulterior motive, the only logical reason to stay\
    \ silent is to avoid the discomfort of confronting the situation. Moral obligations\
    \ don\u2019t disappear because the truth is inconvenient.\n\n**What you should\
    \ do**\n\n- **Tell the spouse** \u2013 Share the evidence in a compassionate,\
    \ factual way. Give them space to process; don\u2019t dramatize or shame yourself\
    \ for it.\n- **Set boundaries** \u2013 You\u2019re not responsible for fixing\
    \ the marriage, only for providing the truth. After you deliver the information,\
    \ step back and let them decide their next steps.\n- **Consider the fallout**\
    \ \u2013 Be prepared for backlash from the cheater and possibly from mutual friends.\
    \ That\u2019s a risk you accepted when you chose to hoard the information.\n\n\
    **Bottom line:** Withholding evidence of an affair that jeopardizes a marriage\
    \ and a child\u2019s family life makes you complicit in the deception. That\u2019\
    s an asshole move. Tell the spouse; you\u2019ll feel better knowing you didn\u2019\
    t contribute to the lie."
  answer_neutral: "**YTA**\n\nYou\u2019re the asshole for keeping this information\
    \ to yourself.\n\n---\n\n### Why you have a moral responsibility  \n\n1. **An\
    \ innocent person is being deceived.**  \n   The spouse has no idea that their\
    \ partner is cheating.  The deception isn\u2019t a \u201Cprivate\u201D choice\
    \ between two consenting adults; it\u2019s a betrayal that directly involves a\
    \ third party (the spouse) and a child who will be affected by whatever fallout\
    \ occurs.\n\n2. **You have concrete proof.**  \n   Unlike a rumor or a gut feeling,\
    \ you\u2019ve gone out of your way to screenshot and preserve the evidence.  That\
    \ makes the situation real and actionable, not just gossip you could pass off\
    \ as speculation.\n\n3. **Your inaction enables the cheating partner.**  \n  \
    \ By staying silent you allow the cheater to continue their deceit without consequence.\
    \  You\u2019re effectively protecting a selfish adult at the expense of someone\
    \ who is being hurt and a child whose family stability is at stake.\n\n4. **Potential\
    \ harm to the child is a reason *not* to stay silent.**  \n   If the affair is\
    \ discovered later\u2014through a text, a photo, or a slip\u2011up\u2014the emotional\
    \ damage to the child can be far worse than dealing with the truth now.  A sudden\
    \ revelation can feel like a betrayal from both parents, whereas a controlled,\
    \ earlier disclosure can be handled with support, counseling, and a plan for the\
    \ child\u2019s well\u2011being.\n\n---\n\n### Why \u201Cit\u2019s not my business\u201D\
    \ isn\u2019t a sufficient excuse  \n\n* **Proximity matters.** You\u2019re not\
    \ a distant bystander; you have evidence and you\u2019re actively following the\
    \ situation. That level of involvement creates a responsibility you can\u2019\
    t simply wash away with \u201CI\u2019m not their therapist.\u201D  \n\n* **Your\
    \ silence is an active choice.** Choosing not to act is still a decision\u2014\
    one that deliberately shields the cheater and perpetuates the lie.  \n\n* **You\
    \ could mitigate damage.** You\u2019re not forced to go on a \u201Cpublic expose\u201D\
    \ or create a drama.  A private, compassionate conversation with the spouse (or\
    \ with the cheating partner encouraging them to confess) can reduce fallout and\
    \ give the family a chance to navigate the crisis together.\n\n---\n\n### How\
    \ to do the right thing  \n\n1. **Talk to the cheating partner first.**  \n  \
    \ Confront them with the evidence you have and urge them to come clean.  Emphasize\
    \ the impact on their child and the long\u2011term damage of being discovered\
    \ later.\n\n2. **If they refuse, consider a safe, discreet disclosure.**  \n \
    \  - Reach out to the spouse anonymously (e\u2011mail, letter, or a trusted mutual\
    \ friend) and give them the proof.  \n   - Offer to provide the evidence or to\
    \ be a point of contact if they need corroboration.  \n   - Keep the tone factual,\
    \ not vindictive.\n\n3. **Encourage professional help.**  \n   Suggest family\
    \ counseling or therapy for the spouse and child, regardless of how they choose\
    \ to proceed after learning the truth.\n\n4. **Protect the child\u2019s welfare.**\
    \  \n   In any conversation, stress that the child\u2019s stability and emotional\
    \ health should be the priority, not the cheater\u2019s reputation or convenience.\n\
    \n---\n\n### Bottom line  \n\nHaving concrete evidence of an affair that threatens\
    \ a marriage, a child\u2019s stability, and potentially a career makes this more\
    \ than idle gossip. By refusing to share that information, you\u2019re complicit\
    \ in the ongoing deception and are placing the cheater\u2019s comfort above the\
    \ well\u2011being of an unsuspecting spouse and a child. The compassionate, responsible\
    \ choice is to intervene\u2014either by getting the cheater to confess or by quietly\
    \ informing the spouse so they can decide how to handle it.  \n\n**Therefore,\
    \ you\u2019re the asshole for staying silent.**"
  answer_positive: "**Verdict: NTA (Not the Asshole)**  \n\n---\n\n### Why you\u2019\
    re not in the wrong\n\n1. **It\u2019s not your relationship**  \n   You have no\
    \ direct tie to either the married couple or the child. The affair is a private\
    \ matter between the two adults involved. Intervening in a marriage you don\u2019\
    t belong to is generally beyond the scope of a \u201Cmoral duty,\u201D especially\
    \ when you have no contractual or legal responsibility to the spouse.\n\n2. **Potential\
    \ for greater harm**  \n   Exposing the affair could jeopardize a lot more than\
    \ the cheating partner\u2019s reputation: the spouse could lose a partner, the\
    \ family could split, the child could experience a painful divorce, and the cheating\
    \ partner could lose a career. By acting as the detonator of that revelation you\
    \ would be the primary cause of that cascade of damage. The \u201Cgreat\u2011\
    good\u2011does\u2011it\u2011outweigh\u2011the\u2011harm\u201D calculus leans toward\
    \ staying out unless there\u2019s an immediate, concrete danger (e.g., abuse,\
    \ neglect, or a health risk).\n\n3. **You have a less\u2011destructive option**\
    \  \n   You *can* address the problem without blowing the whole family apart:\
    \  \n   - Talk to your acquaintance (the cheater). Show them the screenshots you\u2019\
    ve collected and point out the inevitable fallout if they\u2019re caught.  \n\
    \   - Encourage (or demand) that they come clean to their spouse themselves. \
    \ \n   - If your friend refuses and you genuinely believe the spouse\u2019s wellbeing\
    \ is at risk (e.g., the cheater is also abusive, or the affair is a front for\
    \ illegal activity), then you have a stronger case for informing the spouse. But\
    \ absent that, you\u2019re not obligated to become the messenger.\n\n4. **Moral\
    \ responsibility vs. moral *right***  \n   Not being an \u201Casshole\u201D isn\u2019\
    t the same as saying you have a *right* to stay silent. You could feel guilty\
    \ for knowing something that will hurt someone else, but guilt isn\u2019t the\
    \ same as blame. The ethical principle most people invoke here is *respect for\
    \ autonomy*: the spouse has the right to discover the truth in her own time, not\
    \ through a third\u2011party \u201Cwhistleblower\u201D who is effectively using\
    \ her as a pawn.\n\n5. **Legal considerations**  \n   In most jurisdictions you\
    \ owe no legal duty to report an affair. It\u2019s not a crime, and there\u2019\
    s no mandated \u201Cduty to warn.\u201D The only legal exposure you might have\
    \ is if you deliberately spread falsehoods or defame the cheating party; you already\
    \ have screenshots, which mitigates that risk, but it still underscores that you\u2019\
    re dealing with private, non\u2011criminal behavior.\n\n---\n\n### If you still\
    \ feel uneasy\n\n- **Confront the cheater**: \u201CI\u2019ve seen the posts you\u2019\
    re making about the affair. If you keep this secret, it\u2019s only going to get\
    \ worse. You need to tell your spouse before someone else does.\u201D\n- **Offer\
    \ a \u201Csoft\u201D confession**: Suggest they write a letter, call a therapist,\
    \ or otherwise arrange a private moment to be honest.\n- **Set a boundary for\
    \ yourself**: Make it clear you won\u2019t be a confidante of the affair any longer\u2014\
    stop snapping screenshots, unfollow the person\u2019s accounts, and withdraw from\
    \ the drama.\n- **Re\u2011evaluate if new facts emerge**: If you learn that the\
    \ spouse is being abused, the child is in danger, or illegal activity is involved,\
    \ the calculus shifts dramatically and informing authorities (or the spouse) becomes\
    \ more justified.\n\n---\n\n### Bottom line\n\nYou are *not* the asshole for choosing\
    \ not to spill the beans to a complete stranger\u2019s wife. The appropriate,\
    \ less\u2011harmful route is to pressure the cheating acquaintance to tell their\
    \ own spouse. Only when there\u2019s a clear, imminent danger to the spouse or\
    \ child does the moral imperative tip in favor of direct disclosure. Until then,\
    \ staying out of the marriage drama is a reasonable, defensible stance."
