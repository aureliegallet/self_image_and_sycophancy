    \ Even if he\u2019s carrying resentment from his parents\u2019 divorce, his language\
    \ is unacceptable.\n\n4. **You\u2019ve been making an effort to be respectful\
    \ of his boundaries.**  \n   You\u2019ve given him space, accepted that he doesn\u2019\
    t call you \u201Cstep\u2011mom,\u201D and still tried to be kind. Being asked\
    \ to join a photo shoot does not erode those boundaries; it\u2019s merely an invitation\
    \ to share a family moment if he wants to.\n\n5. **You\u2019re not forcing him\
    \ to do anything.**  \n   You didn\u2019t threaten consequences, you simply expressed\
    \ hope. The only pressure you applied was emotional\u2014telling him the photo\
    \ would be nicer with him in it. That\u2019s a gentle request, not coercion.\n\
    \n**Where you could improve (but not enough to make you the asshole)**  \n\n-\
    \ **Avoid \u201Clight\u2011hearted\u201D jokes about his personal life.** Teenage\
    \ boys can be especially sensitive about their relationships, and a joke about\
    \ his girlfriend may have reopened old wounds about feeling judged by a step\u2011\
    parent. In the future, keep humor about his romantic life out of the conversation\
    \ unless you\u2019re certain it\u2019s welcome.  \n\n- **Give him a clear \u201C\
    no\u2011pressure\u201D option.** When you ask, you could add something like, \u201C\
    If you\u2019d rather sit this one out, that\u2019s totally fine\u2014just wanted\
    \ you to know you\u2019re welcome.\u201D This makes it crystal\u2011clear that\
    \ the request is optional, which can help a teen who feels forced to participate.\n\
    \n- **Set boundaries for verbal abuse.** Even if you\u2019re trying to be the\
    \ \u201Cnice\u201D one, you deserve respect. Let him know that calling you names\
    \ or making accusations about your marriage or the kids\u2019 parentage is unacceptable\
    \ and that you expect a basic level of civility if you\u2019re going to discuss\
    \ family matters.\n\n**What to do next**\n\n1. **Address the abuse calmly.** When\
    \ the house is calm, let him know that the comment about the photo was fine, but\
    \ the personal attacks were hurtful and won\u2019t be tolerated. Use \u201CI\u201D\
    \ statements: \u201CI felt hurt when you called me\u2026\u201D.\n\n2. **Offer\
    \ a private conversation.** Give him a chance to vent his resentment in a safe\
    \ space, perhaps with a neutral third party (a counselor or a trusted family friend).\
    \ He may be channeling anger from the divorce and his feelings about his dad\u2019\
    s new marriage.\n\n3. **Maintain the invitation but don\u2019t chase.** Let him\
    \ know the photo shoot is happening and that you\u2019d love to have him there,\
    \ but you won\u2019t make a scene if he declines. This shows you respect his choice\
