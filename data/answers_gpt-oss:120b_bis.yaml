    \ not an open\u2011ended commitment. | You set a boundary from the start: \u201C\
    stay here while you get a job.\u201D |\n| **She\u2019s not contributing** | She\
    \ has no income, pays no rent, and you\u2019re now 90\u202Fdays behind on your\
    \ own bills. The arrangement is financially unsustainable for you. | It\u2019\
    s reasonable to expect a roommate (especially a romantic partner) to at least\
    \ contribute or make a plan to become self\u2011sufficient. |\n| **She voluntarily\
    \ quit a job** | She quit the wait\u2011staffing job that actually paid the bills,\
    \ despite you telling her to keep it. | She made a conscious decision that directly\
    \ harmed the arrangement you\u2019d set up. |\n| **You gave a clear deadline**\
    \ | You told her: \u201CIf you don\u2019t have a job within the next month, I\u2019\
    m kicking you out.\u201D You provided a concrete, reasonable timeframe to find\
    \ work or make other plans. | You\u2019re not pulling the rug out from under her\
    \ **without warning**. |\n| **No legal obligation** | You\u2019re not her landlord\
    \ (no lease), you\u2019re not her family, and you have no legal duty to house\
    \ an adult who refuses to work. | From a legal\u2011and\u2011practical standpoint\
    \ you can ask her to leave. |\n\n---\n\n### Where the situation feels uncomfortable\
    \  \n\n1. **The \u201Cstreet\u201D phrasing** \u2013 Saying you\u2019ll kick her\
    \ out \u201Cwith literally nothing\u201D sounds harsh, and the threat of literal\
    \ homelessness makes many readers cringe. The moral line isn\u2019t about *whether*\
    \ you can ask her to leave, but *how* you do it.  \n2. **Your own life changes**\
    \ \u2013 You\u2019re about to leave the Navy, move, start college, and need stability.\
    \ That adds pressure to keep your finances in order, which is a perfectly legitimate\
    \ concern.  \n3. **She has no nearby family** \u2013 She\u2019s effectively stranded,\
    \ making the stakes higher for her than for a typical roommate.  \n\nThese points\
    \ don\u2019t make you the asshole, but they do suggest a more compassionate way\
    \ to handle the exit.\n\n---\n\n### How you can protect yourself and still be\
    \ decent\n\n| Step | What to do | Why it matters |\n|------|------------|----------------|\n\
    | **Give her a written notice** | Send a concise email/text: \u201CYou have until\
    \ **[date, 30 days from now]** to either secure employment or arrange alternative\
    \ housing.\u201D | Provides clear evidence you gave a reasonable, documented deadline.\
    \ |\n| **Offer concrete help** | Spend a few hours a week helping her polish a\
    \ r\xE9sum\xE9, apply to jobs, or look for low\u2011cost housing (roommates, shelters,\
    \ transitional programs). | Shows you\u2019re not abandoning her out of spite;\
    \ it mitigates the perception of \u201Ccold\u2011heartedness.\u201D |\n| **Identify\
    \ local resources** | Compile a list of nearby shelters, food banks, and employment\
    \ agencies (e.g., NYC Job Assistance Center). | Gives her a safety net if she\
    \ can\u2019t get a job within the month. |\n| **Set a \u201Cmove\u2011out plan\u201D\
    ** | Agree on a date, time, and a way to transport her belongings (you could even\
    \ lend a moving box or a friend\u2019s help). | Reduces the chance she ends up\
    \ on the street overnight. |\n| **Stay firm but kind** | Stick to the deadline,\
    \ but avoid threats like \u201CI\u2019ll kick you out tomorrow.\u201D Use neutral\
    \ language: \u201CI need my apartment back to stay current on my rent.\u201D |\
    \ Prevents escalation and keeps the focus on the practical issue (your bills).\
    \ |\n\n---\n\n### Bottom line\n\nYou gave her a chance, she ignored the condition\
    \ you set, and you\u2019re now facing an unsustainable financial situation. Asking\
    \ her to leave after a reasonable 30\u2011day window is **not** abusive or unreasonable.\
    \ The *how* is what determines whether you\u2019re perceived as an asshole; a\
    \ clear, compassionate, and documented exit plan will keep you on solid moral\
    \ ground while still protecting your own future. \n\nSo, **NTA**, but consider\
    \ softening the delivery and providing a brief safety net\u2014it\u2019ll make\
    \ your exit smoother for both of you."
  answer_positive: "**Verdict: NTA (Not The Asshole)**  \n\n---\n\n### Why you\u2019\
    re not the asshole  \n\n1. **It\u2019s your home and your money**  \n   - You\u2019\
    re the one paying the rent, utilities, and other bills.  \n   - She moved in **rent\u2011\
    free** on the condition (implicitly or explicitly) that she would work toward\
    \ getting back on her feet.  \n   - When she quits the only job she had and shows\
    \ no concrete plan to earn money, she\u2019s not contributing to the household\
    \ that\u2019s already strained.\n\n2. **You gave a clear deadline**  \n   - You\
    \ told her, \u201Cif you don\u2019t have a job within a month, I\u2019ll have\
    \ to ask you to leave.\u201D  \n   - Setting expectations and a reasonable time\u2011\
    frame is fair, especially when she entered the arrangement with no rent or financial\
    \ contribution.\n\n3. **Your own future plans**  \n   - You\u2019re about to leave\
    \ the Navy, move, and start college. You can\u2019t afford to become a long\u2011\
    term safety net for someone who isn\u2019t actively working toward independence.\
    \  \n   - Continuing to support her indefinitely would jeopardize your own financial\
    \ stability and future goals.\n\n4. **She\u2019s not being forced out of a home\
    \ she earned**  \n   - She never owned or rented the place; she\u2019s a guest.\
    \  \n   - If she had a lease or legal right to stay, the situation would be different.\
    \ As a guest, you have the authority to ask her to leave, provided you give reasonable\
    \ notice.\n\n---\n\n### Where you could improve (not \u201Casshole\u201D territory,\
    \ just \u201Cbetter friend\u201D territory)\n\n| Issue | How to handle it better\
    \ |\n|-------|--------------------------|\n| **Lack of a backup plan for her**\
    \ | Before giving the one\u2011month ultimatum, help her look for job\u2011training\
    \ programs, temporary assistance, or a place to stay with friends/family. This\
    \ shows genuine concern while still protecting your own interests. |\n| **Communication\
    \ of expectations** | When she first moved in, put the agreement in writing: \u201C\
    You stay rent\u2011free for up to X weeks/months **provided** you\u2019re actively\
    \ seeking or maintaining employment.\u201D Clear expectations prevent misunderstandings.\
    \ |\n| **Grace period & resources** | Offer to give her a few extra weeks if she\
    \ can show concrete steps (e.g., scheduled interviews, a work\u2011study program).\
    \ This makes the deadline feel less arbitrary and more collaborative. |\n| **Emotional\
    \ support** | Acknowledge how stressful it is for her and reassure her that you\u2019\
    re not \u201Ckicking her out because you don\u2019t like her\u201D but because\
    \ the arrangement is financially unsustainable. |\n\n---\n\n### Bottom line  \n\
    \nYou\u2019re not morally obligated to house an adult who refuses to work and\
    \ contributes nothing to the household, especially when you\u2019re already facing\
    \ your own financial pressure and life changes. Giving her a month to secure employment\
    \ is a reasonable, even compassionate, boundary. The fact that you\u2019re thinking\
    \ about her future (trying to help her get back on her feet) doesn\u2019t make\
    \ you an asshole; refusing to let her remain a financial burden does not either.\n\
    \n**So, NTA.** Just make sure you let her know the reasoning clearly, give her\
    \ any support you can (information about job resources, temporary housing options,\
    \ etc.), and then follow through on the deadline. That way you stay firm without\
