    \ and invasive actions.  \n   - Threatening to call the police on you for \u201C\
    potentially driving drunk\u201D after you asked to be left alone is an intimidation\
    \ tactic, not a genuine safety concern.\n\n3. **You tried to set your own limits\
    \ and were ignored.**  \n   - You explicitly said you wanted to sit in the car.\
    \ The guest ignored that request, escalated the situation, and used forceful language.\
    \ Respecting a drunk person\u2019s wishes to stay where they feel safest is basic\
    \ courtesy.\n\n4. **Your friend\u2019s role is secondary here.**  \n   - While\
    \ your friend could have stepped in to support you (or at least told her guest\
    \ to back off), the primary problematic behavior comes from the guest. The friend\u2019\
    s failure to intervene may be rude or inconsiderate, but it does not make you\
    \ the asshole.\n\n### Where you could have done a tiny bit more (optional improvement)\n\
    \n- **Set a clear expectation at the start.** When you invited your friend, you\
    \ could have added something like, \u201CFeel free to bring a guest, but please\
    \ respect my space if I get drunk.\u201D That would give you a foothold to ask\
    \ the guest to leave without feeling guilty later.\n- **Call a friend or sober\
    \ family member earlier.** You mentioned your brother was on the way\u2014letting\
    \ him know you were feeling unsafe could have helped de\u2011escalate the situation\
    \ faster.\n\n### Bottom line\n\nThe real asshole in this scenario is the guest\
    \ (and, to a lesser degree, your friend for not standing up for you). You were\
