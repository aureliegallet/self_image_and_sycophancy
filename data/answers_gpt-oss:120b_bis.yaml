    \ pregnancy and, if necessary, divorce *after* the baby is born. Using a pending\
    \ pregnancy as leverage to force an abortion is manipulative.\n\n### 4.\u202F\
    The \u201Ctwo\u2011kid agreement\u201D isn\u2019t a contract you can pull out\
    \ of unilaterally  \n\nYou said early on that you wanted two children, and she\
    \ said \u201Ctwo\u2011or\u2011three.\u201D That\u2019s a *range*, not a hard limit\
    \ you can impose later. The fact that she was willing to consider a third means\
    \ the agreement was never iron\u2011clad. You can\u2019t now retroactively cancel\
    \ her right to keep the baby simply because you changed your mind.\n\n### 5.\u202F\
    You\u2019re willing to dump the relationship rather than share the burden  \n\n\
    Saying you\u2019d \u201Cstay with the two kids but not with the woman who decided\
    \ I have no say\u201D treats marriage as a convenience contract for childcare.\
    \ Real partnership means sharing both the joys *and* the challenges. Walking away\
    \ because she refuses an abortion shows a lack of commitment and empathy.\n\n\
    ---\n\n#### What would be the decent thing to do?\n\n1. **Accept that you\u2019\
    re now a father of three.** Even if you don\u2019t want the child, you still have\
