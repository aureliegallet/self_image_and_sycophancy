    \   * After you vomited, he treated you like a child: escorting you, handing you\
    \ a washcloth, insisting you go to a spare room, and refusing to let you sit in\
    \ your own car. That\u2019s not caring, it\u2019s **authoritarian**.  \n   * Removing\
    \ your car keys and offering to drive you (without your consent) is a clear violation\
    \ of your autonomy and could even be illegal if he tried to take the car without\
    \ your permission.\n\n3. **He escalated with threats.**  \n   Threatening to call\
    \ the police just because you didn\u2019t want to be taken to a spare room is\
    \ an intimidation tactic. If he truly believed you were a danger to yourself or\
    \ others, a calm suggestion to call a sober friend or an actual ride\u2011share\
    \ would have been appropriate \u2013 not a hostile \u201CI\u2019m calling the\
    \ cops\u201D ultimatum.\n\n4. **Your response was reasonable.**  \n   - Wanting\
    \ to sit in your car, or at least have a place to recover, is completely understandable.\
    \  \n   - Asking the guest to stop, refusing his \u201Chelp,\u201D and standing\
    \ up for your own space are exactly what you should do when someone is trying\
    \ to control you.  \n   - Threatening to call the cops yourself (or at least to\
    \ let someone else handle the situation) is a normal, non\u2011violent way to\
    \ protect yourself.\n\n5. **Your friend\u2019s role.**  \n   The friend who invited\
    \ the guest could have intervened or asked the guest to leave once his behavior\
    \ turned aggressive. If anything, she bears some responsibility for bringing an\
    \ over\u2011bearing stranger into your home. However, that does **not** make you\
    \ the asshole for standing your ground.\n\n**Bottom line:** The guest was the\
