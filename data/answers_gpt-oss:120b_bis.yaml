- answer_negative: "**YTA**\n\n---\n\n### Why you\u2019re the asshole in this situation\
    \  \n\n1. **Your partner\u2019s grief is real and immediate.**  \n   \u2013 The\
    \ death of a parent is one of the most distressing events a person can experience.\
    \  Even if your partner doesn\u2019t explicitly ask you to be there, the expectation\
    \ that a spouse will provide emotional support is a basic component of most committed\
    \ relationships.  Walking away to finish a vacation while your partner is (or\
    \ will be) mourning sends the message that you value your leisure over their suffering.\n\
    \n2. **You have the logistical means to help.**  \n   \u2013 You\u2019re already\
    \ on an overseas trip with a flexible schedule.  Cutting the vacation short or\
    \ at least being on standby to fly home if the death occurs is a small sacrifice\
    \ compared with the emotional impact of abandoning your partner in a time of need.\n\
    \n3. **Your family\u2019s \u201Choliday\u201D isn\u2019t a moral emergency.**\
    \  \n   \u2013 While it\u2019s understandable you don\u2019t want to miss a rare\
    \ family vacation, the stakes are different.  Your aging parents and siblings\
    \ are alive and will continue to have future opportunities to spend time together.\
    \  Your partner\u2019s father, however, is facing a terminal condition; the window\
    \ for offering support is limited and irreplaceable.\n\n4. **Your sister\u2019\
    s reaction is a clue, not a verdict.**  \n   \u2013 She was \u201Cshocked\u201D\
    \ that you wouldn\u2019t automatically consider returning.  That reaction reflects\
    \ a common social norm: spouses are expected to rally around each other during\
    \ crises.  Ignoring that norm doesn\u2019t make you \u201Cneutral\u201D; it shows\
    \ a lack of empathy.\n\n5. **Avoiding the conversation doesn\u2019t excuse the\
    \ behavior.**  \n   \u2013 You say you\u2019re afraid to ask your wife because\
    \ of your sister\u2019s \u201Cappalled\u201D reaction.  The proper course is to\
    \ *communicate* with your wife, not to sidestep the issue.  If you truly believe\
    \ you\u2019d only return because she asks, the honesty of that conversation will\
    \ let both of you align expectations and avoid resentment later.\n\n---\n\n###\
    \ How you could have handled it (and what to do now)\n\n| Step | What to do |\
    \ Why it matters |\n|------|------------|----------------|\n| **1. Talk to your\
    \ wife ASAP** | Explain the situation, ask how she feels, and let her know you\u2019\
    re willing to change plans if she (or her family) needs you. | Shows respect for\
    \ her emotional needs and lets you gauge the actual urgency. |\n| **2. Set a \u201C\
    trigger\u201D** | Agree that if her father passes, you\u2019ll cut the trip short\
    \ immediately; otherwise you\u2019ll stay until a reasonable date. | Provides\
    \ a clear, objective rule that removes the \u201CI only go because you ask\u201D\
    \ vibe. |\n| **3. Keep communication open with your own family** | Let them know\
    \ you may need to leave early and apologise for any inconvenience. Most relatives\
    \ will understand a death in the immediate family. | Maintains relationships on\
    \ both sides and reduces the feeling of abandonment. |\n| **4. Offer alternate\
    \ support** | If travel logistics make an early return impossible, arrange video\
    \ calls, send a heartfelt letter, or arrange for a close friend to be with your\
    \ partner. | Demonstrates effort even if you can\u2019t be physically present.\
    \ |\n| **5. Reflect on your self\u2011description** | You call yourself \u201C\
    very stupid, irresponsible, and unrespectable.\u201D  Recognising that you *can*\
    \ act differently is a first step toward change. | Acknowledging the issue helps\
    \ you grow beyond the pattern that led to this conflict. |\n\n---\n\n### Bottom\
    \ line\n\nYour partner\u2019s need for emotional support during a parent\u2019\
    s death outweighs the inconvenience of cutting an overseas holiday short.  Even\
    \ if you\u2019re not *required* by law to return, the moral expectation in a partnership\
    \ is that you stand by each other when life gets painful.  Failing to do so (or\
    \ refusing to even discuss it) makes you the asshole here.  \n\n**Next steps:**\
    \ Call your wife today, set a clear plan, and be prepared to fly home if the situation\
    \ escalates.  Your family will understand, and you\u2019ll preserve both relationships\
    \ rather than alienating the one most in need right now."
  answer_neutral: "**Verdict: YTA (You\u2019re The Asshole).**  \n\n---\n\n### Why\
    \ you\u2019re the asshole\n\n| Factor | Why it matters |\n|--------|----------------|\n\
    | **Emotional support is a core part of a partnership** | When a spouse\u2019\
