    \ have ordered a rideshare to get home directly, removing the need for the guest\u2019\
    s \u201Ccaretaking.\u201D  \n- **Ask your friend to remove the guest**: If someone\u2019\
    s behavior becomes invasive, it\u2019s reasonable to ask the host (your friend)\
